<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training — market-agent</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .training-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
    }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-value {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .stat-value.accent { color: var(--accent); }
    .stat-value.green  { color: var(--green);  }
    .stat-value.yellow { color: var(--yellow); }
    .stat-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
      font-family: var(--mono);
    }

    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 14px;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .chart-title {
      font-size: 13px;
      font-weight: 600;
    }
    .chart-legend {
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--muted);
    }
    .legend-dot {
      display: inline-block;
      width: 10px; height: 3px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: middle;
    }
    canvas { display: block; width: 100% !important; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }
    .live-dot.idle { background: var(--muted); animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .3; }
    }

    .epoch-bar-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      margin-bottom: 8px;
    }
    .epoch-bar-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }
    .epoch-bar-track {
      height: 6px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
    }
    .epoch-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--green));
      transition: width .4s ease;
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .model-selector label { font-size: 12px; color: var(--muted); }
    .model-selector input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 5px 10px;
      width: 220px;
    }
    .model-selector button {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      padding: 5px 14px;
      cursor: pointer;
    }
    .arch-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      font-family: var(--mono);
      font-size: 12px;
    }
    .arch-btn {
      background: var(--surface2);
      border: none;
      border-right: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 14px;
      cursor: pointer;
      transition: all .15s;
    }
    .arch-btn:last-child { border-right: none; }
    .arch-btn.active {
      background: rgba(79,142,247,.15);
      color: var(--accent);
    }
    .refresh-info { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--mono); }
    .scale-btn {
      background: var(--surface2);
      border: none;
      border-right: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      cursor: pointer;
      transition: all .15s;
    }
    .scale-btn:last-child { border-right: none; }
    .scale-btn.active {
      background: rgba(79,142,247,.15);
      color: var(--accent);
    }
    .reset-zoom-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-size: 11px;
      font-family: var(--mono);
      padding: 4px 10px;
      cursor: pointer;
      transition: all .15s;
    }
    .reset-zoom-btn:hover { color: var(--text); border-color: var(--accent); }

    .toggle-label {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--muted);
      cursor: pointer; user-select: none;
    }
    .toggle-label input[type=checkbox] { display: none; }
    .toggle-knob {
      width: 28px; height: 15px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px; position: relative;
      transition: background .2s;
    }
    .toggle-knob::after {
      content: ''; position: absolute;
      width: 11px; height: 11px;
      background: var(--muted); border-radius: 50%;
      top: 1px; left: 1px;
      transition: transform .2s, background .2s;
    }
    .toggle-label input:checked + .toggle-knob { background: rgba(79,142,247,.25); border-color: var(--accent); }
    .toggle-label input:checked + .toggle-knob::after { transform: translateX(13px); background: var(--accent); }

    /* ── No-scroll viewport fit ── */
    body { overflow: hidden; }
    .main { height: 100vh; overflow: hidden; }
    .page-header { padding: 14px 32px 0; }
    .page-content { overflow: hidden; padding-top: 12px; padding-bottom: 8px; }

    /* Chart cards fill remaining vertical space */
    .charts-area {
      display: grid;
      grid-template-columns: 3fr 2fr;
      height: calc(100vh - 340px);  /* viewport minus header + controls + stat cards */
      gap: 10px;
    }
    .chart-card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    canvas { position: absolute; inset: 0; }
  </style>
</head>
<body>
<script src="assets/nav.js"></script>

<div class="main">
  <div class="page-header">
    <div class="page-title">Training Monitor</div>
    <div class="page-subtitle">Live loss curves from epoch_log.jsonl</div>
  </div>

  <div class="page-content">

    <div class="model-selector">
      <label>Model</label>
      <div class="arch-toggle">
        <button class="arch-btn active" id="arch-v1" onclick="switchArch('DualCNN_v1')">v1</button>
        <button class="arch-btn"        id="arch-v2" onclick="switchArch('DualCNN_v2')">v2</button>
      </div>
      <input type="text" id="model-name" value="DualCNN_v1" placeholder="model folder name">
      <button onclick="load()">Load</button>
      <span class="refresh-info">Auto-refresh in <span id="countdown">30</span>s</span>
    </div>

    <div class="status-bar">
      <div class="live-dot" id="live-dot"></div>
      <span id="status-text">Loading…</span>
    </div>

    <!-- Epoch progress bar -->
    <div class="epoch-bar-wrap">
      <div class="epoch-bar-label">
        <span>Epoch progress</span>
        <span id="epoch-progress-label">—</span>
      </div>
      <div class="epoch-bar-track">
        <div class="epoch-bar-fill" id="epoch-bar" style="width:0%"></div>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="training-grid">
      <div class="stat-card">
        <div class="stat-label">Current Epoch</div>
        <div class="stat-value accent" id="stat-epoch">—</div>
        <div class="stat-sub" id="stat-epoch-sub">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Train MSE (now)</div>
        <div class="stat-value" id="stat-train">—</div>
        <div class="stat-sub" id="stat-train-sub">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Best Val MSE</div>
        <div class="stat-value green" id="stat-val">—</div>
        <div class="stat-sub" id="stat-val-sub">no val yet</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Elapsed</div>
        <div class="stat-value yellow" id="stat-elapsed">—</div>
        <div class="stat-sub" id="stat-elapsed-sub">—</div>
      </div>
    </div>

    <div class="charts-area">

      <!-- Left: overall loss (all epochs) -->
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title">Loss vs total batches</div>
          <div style="display:flex;align-items:center;gap:12px">
            <div style="display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;font-family:var(--mono);font-size:11px">
              <button class="scale-btn active" id="btn-linear" onclick="setScale('linear')">linear</button>
              <button class="scale-btn" id="btn-log2"   onclick="setScale('log2')">log₂</button>
              <button class="scale-btn" id="btn-log10"  onclick="setScale('log10')">log₁₀</button>
            </div>
            <button class="reset-zoom-btn" onclick="resetZoom()" title="Reset zoom">⊙ reset zoom</button>
            <label class="toggle-label" title="Exponential moving average smoothing (α=0.04, ~17-batch half-life)">
              EMA<input type="checkbox" id="toggle-ema" checked onchange="onSmoothingChange()"><span class="toggle-knob"></span>
            </label>
            <label class="toggle-label" title="Bézier curve interpolation between data points (tension=0.3)">
              Spline<input type="checkbox" id="toggle-spline" checked onchange="onSmoothingChange()"><span class="toggle-knob"></span>
            </label>
            <div class="chart-legend">
              <span><span class="legend-dot" style="background:#4f8ef7"></span>Train</span>
              <span><span class="legend-dot" style="background:#f76f6f"></span>Val</span>
              <span><span class="legend-dot" style="background:#3dd68c;width:6px;height:6px;border-radius:50%"></span>★</span>
            </div>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="loss-chart"></canvas>
        </div>
      </div>

      <!-- Right: latest epoch batch-level progress -->
      <div class="chart-card">
        <div class="chart-header">
          <div class="chart-title" id="epoch-chart-title">Latest epoch</div>
          <div class="chart-legend">
            <span><span class="legend-dot" style="background:#4f8ef7"></span>Train MSE</span>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="epoch-chart"></canvas>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="assets/utils.js"></script>
<script>
  const LOG_BASE = 'data/models/';
  const KNOWN_ARCHS = ['DualCNN_v1', 'DualCNN_v2'];

  function switchArch(name) {
    document.getElementById('model-name').value = name;
    KNOWN_ARCHS.forEach(a => {
      const btn = document.getElementById('arch-' + a.replace('DualCNN_', '').toLowerCase());
      if (btn) btn.classList.toggle('active', a === name);
    });
    load();
  }

  // Keep toggle in sync when the text input is edited manually.
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('model-name').addEventListener('input', e => {
      KNOWN_ARCHS.forEach(a => {
        const btn = document.getElementById('arch-' + a.replace('DualCNN_', '').toLowerCase());
        if (btn) btn.classList.toggle('active', a === e.target.value.trim());
      });
    });
  });

  let lossChart       = null;
  let epochChart      = null;
  let epochChartEpoch = null;   // tracks which epoch epochChart was built for
  let cachedRecords   = null;
  let countdown     = 30;
  let timer         = null;
  let scaleMode = 'linear';  // 'linear' | 'log2' | 'log10'

  // ── Scale helpers ──────────────────────────────────────────────────────────
  // Data is pre-transformed so the y-axis always stays linear.
  // log2:  each gridline = one halving of error
  // log10: each gridline = one order of magnitude
  function toPlot(v) {
    if (v == null || v <= 0) return v;
    if (scaleMode === 'log2')  return Math.log2(v);
    if (scaleMode === 'log10') return Math.log10(v);
    return v;
  }
  function fromPlot(v) {
    if (scaleMode === 'log2')  return Math.pow(2,  v);
    if (scaleMode === 'log10') return Math.pow(10, v);
    return v;
  }
  function tickLabel(v) {
    if (scaleMode === 'linear') return v.toPrecision ? v.toPrecision(3) : v;
    const orig = fromPlot(v);
    return orig >= 0.01 ? orig.toPrecision(2) : orig.toExponential(1);
  }
  function tooltipLabel(ctx) {
    const val = scaleMode === 'linear' ? ctx.parsed.y : fromPlot(ctx.parsed.y);
    return ` ${ctx.dataset.label}: ${val.toExponential(4)}`;
  }
  function yAxisLabel(base) {
    if (scaleMode === 'log2')  return `log₂(${base})`;
    if (scaleMode === 'log10') return `log₁₀(${base})`;
    return base;
  }

  function setScale(mode) {
    scaleMode = mode;
    ['linear','log2','log10'].forEach(m =>
      document.getElementById('btn-' + m).classList.toggle('active', m === mode)
    );
    if (lossChart)  { lossChart.destroy();  lossChart  = null; }
    if (epochChart) { epochChart.destroy(); epochChart = null; epochChartEpoch = null; }
    if (cachedRecords) render(cachedRecords);
  }

  // Chart.js defaults for dark theme
  Chart.defaults.color           = '#6b7280';
  Chart.defaults.borderColor     = '#2e3350';
  Chart.defaults.backgroundColor = 'transparent';

  function fmtMSE(v) { return v == null ? '—' : v.toFixed(6); }
  function fmtMin(s) {
    const m = Math.floor(s / 60), sec = Math.round(s % 60);
    return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
  }

  function dedup(records) {
    const seen = new Map();
    for (const r of records) seen.set(`${r.epoch}|${r.batch ?? 'null'}`, r);
    return [...seen.values()].sort((a, b) => {
      if (a.epoch !== b.epoch) return a.epoch - b.epoch;
      return (a.batch ?? 1e9) - (b.batch ?? 1e9);
    });
  }

  function yAxis(label) {
    return {
      type: 'linear',   // always linear; data pre-transformed to log space if needed
      title: { display: true, text: yAxisLabel(label), color: '#6b7280' },
      grid: { color: '#2e3350' },
      ticks: { color: '#6b7280', callback: tickLabel },
    };
  }

  function tooltipPlugin() {
    return { legend: { display: false }, tooltip: { callbacks: { label: tooltipLabel } } };
  }

  function resetZoom() {
    if (lossChart) {
      delete lossChart.options.scales.x.min;
      delete lossChart.options.scales.x.max;
      lossChart.update('none');
    }
    if (epochChart) {
      delete epochChart.options.scales.x.min;
      delete epochChart.options.scales.x.max;
      epochChart.update('none');
    }
  }

  // Double-click chart to enter selection mode, then drag to zoom.
  // Double-click again or press ESC to cancel.
  // mousemove/mouseup are tracked on document so the drag works even when
  // the cursor leaves the canvas, and coordinates are clamped to the plot
  // area so getValueForPixel never receives a pixel inside the axis margins.
  function attachZoom(chartGetter, canvasEl) {
    let inZoomMode     = false;
    let dragStart      = null;
    let docMoveHandler = null;
    let docUpHandler   = null;

    const wrap = canvasEl.parentElement;

    const selEl = document.createElement('div');
    selEl.style.cssText = `
      position:absolute; display:none; pointer-events:none;
      background:rgba(79,142,247,.12); border:1px solid rgba(79,142,247,.55);
      top:0; height:100%;
    `;
    wrap.appendChild(selEl);

    const badge = document.createElement('div');
    badge.style.cssText = `
      position:absolute; top:6px; right:6px; display:none; pointer-events:none;
      background:rgba(79,142,247,.18); border:1px solid rgba(79,142,247,.45);
      border-radius:4px; padding:2px 8px; font-size:10px;
      font-family:var(--mono); color:rgba(79,142,247,.9);
    `;
    badge.textContent = 'drag to zoom  ·  ESC to cancel';
    wrap.appendChild(badge);

    function canvasPx(clientX) {
      return clientX - canvasEl.getBoundingClientRect().left;
    }
    function clamp(px) {
      const chart = chartGetter();
      if (!chart) return px;
      return Math.max(chart.scales.x.left, Math.min(chart.scales.x.right, px));
    }

    function enter() {
      inZoomMode = true;
      canvasEl.style.cursor = 'crosshair';
      badge.style.display = '';
    }
    function exit() {
      if (docMoveHandler) { document.removeEventListener('mousemove', docMoveHandler); docMoveHandler = null; }
      if (docUpHandler)   { document.removeEventListener('mouseup',   docUpHandler);   docUpHandler   = null; }
      inZoomMode = false;
      dragStart  = null;
      canvasEl.style.cursor = '';
      badge.style.display   = 'none';
      selEl.style.display   = 'none';
    }

    canvasEl.addEventListener('dblclick', () => inZoomMode ? exit() : enter());
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && inZoomMode) exit(); });

    canvasEl.addEventListener('mousedown', e => {
      if (!inZoomMode) return;
      dragStart = clamp(canvasPx(e.clientX));
      selEl.style.left    = dragStart + 'px';
      selEl.style.width   = '0';
      selEl.style.display = '';

      docMoveHandler = ev => {
        const cur = clamp(canvasPx(ev.clientX));
        selEl.style.left  = Math.min(dragStart, cur) + 'px';
        selEl.style.width = Math.abs(cur - dragStart) + 'px';
      };
      docUpHandler = ev => {
        const cur = clamp(canvasPx(ev.clientX));
        const dx  = Math.abs(cur - dragStart);
        if (dx > 8) {
          const chart = chartGetter();
          if (chart) {
            const scale = chart.scales.x;
            chart.options.scales.x.min = scale.getValueForPixel(Math.min(dragStart, cur));
            chart.options.scales.x.max = scale.getValueForPixel(Math.max(dragStart, cur));
            chart.update('none');
          }
        }
        exit();
      };
      document.addEventListener('mousemove', docMoveHandler);
      document.addEventListener('mouseup',   docUpHandler);
    });
  }

  function useEMA()    { return document.getElementById('toggle-ema').checked; }
  function useSpline() { return document.getElementById('toggle-spline').checked; }
  function tension()   { return useSpline() ? 0.3 : 0; }

  function onSmoothingChange() {
    if (lossChart)  { lossChart.destroy();  lossChart  = null; }
    if (epochChart) { epochChart.destroy(); epochChart = null; epochChartEpoch = null; }
    if (cachedRecords) render(cachedRecords);
  }

  // Apply EMA smoothing to batch records across epoch boundaries.
  // alpha=0.04 ≈ 17-batch half-life so the curve is smooth but responsive.
  function applyEMA(records, alpha = 0.04) {
    let ema = null;
    return records.map(r => {
      if (r.batch == null || r.train_mse == null) return r;
      ema = ema == null ? r.train_mse : (1 - alpha) * ema + alpha * r.train_mse;
      return Object.assign({}, r, { train_mse: ema });
    });
  }

  function render(records) {
    const smoothed   = useEMA() ? applyEMA(records) : records;
    const batchRecs  = records.filter(r => r.batch != null);
    const epochRecs  = records.filter(r => r.batch == null);
    const last      = records[records.length - 1];
    const lastEpoch = epochRecs[epochRecs.length - 1] ?? null;
    const bestVal   = lastEpoch ? Math.min(...epochRecs.map(r => r.val_mse)) : null;

    // ── Status ──
    document.getElementById('live-dot').className = 'live-dot';
    document.getElementById('status-text').textContent =
      `${document.getElementById('model-name').value.trim()} · ${records.length} records · last at ${fmtMin(last?.elapsed_secs ?? 0)} elapsed`;

    // ── Epoch progress bar ──
    const curEpoch     = last?.epoch ?? 1;
    const curBatch     = last?.batch ?? 0;
    const totalEpochs  = 150;
    const totalBatches = 8758;
    const epochPct = Math.round((curBatch ?? totalBatches) / totalBatches * 100);
    document.getElementById('epoch-bar').style.width = epochPct + '%';
    document.getElementById('epoch-progress-label').textContent =
      `Epoch ${curEpoch} · batch ${curBatch ?? '✓'} / ${totalBatches}  (${epochPct}%)`;

    // ── Stat cards ──
    document.getElementById('stat-epoch').textContent     = `${curEpoch} / ${totalEpochs}`;
    document.getElementById('stat-epoch-sub').textContent = `${epochRecs.length} epoch(s) completed`;
    document.getElementById('stat-train').textContent     = fmtMSE(last?.train_mse);
    document.getElementById('stat-train-sub').textContent = last?.batch != null ? `batch ${last.batch} / ${totalBatches}` : 'epoch end';
    document.getElementById('stat-val').textContent       = fmtMSE(bestVal);
    document.getElementById('stat-val-sub').textContent   = lastEpoch
      ? `epoch ${lastEpoch.epoch} · improved: ${epochRecs.filter(r => r.improved).length}×`
      : 'no val yet';
    document.getElementById('stat-elapsed').textContent     = fmtMin(last?.elapsed_secs ?? 0);
    document.getElementById('stat-elapsed-sub').textContent = `${batchRecs.length} batch records`;

    // ── Cumulative batch index ──
    // For each epoch, find the highest batch number logged (= batches in that epoch).
    const epochMaxBatch = {};
    for (const r of batchRecs) {
      epochMaxBatch[r.epoch] = Math.max(epochMaxBatch[r.epoch] ?? 0, r.batch);
    }
    // Build cumulative offset: how many total batches were done before epoch e started.
    const sortedEpochs = Object.keys(epochMaxBatch).map(Number).sort((a, b) => a - b);
    const cumOffset = {};
    let runningBatches = 0;
    for (const e of sortedEpochs) {
      cumOffset[e] = runningBatches;
      runningBatches += epochMaxBatch[e];
    }
    function totalBatch(r) {
      const offset = cumOffset[r.epoch] ?? 0;
      // epoch-end record (batch=null): place at the end of that epoch
      return offset + (r.batch ?? epochMaxBatch[r.epoch] ?? 0);
    }

    // ── Loss chart ──
    const pt = (r, y) => ({ x: totalBatch(r), y: toPlot(y) });

    const datasets = [{
      label: 'Train MSE',
      data: smoothed.filter(r => r.batch != null).map(r => pt(r, r.train_mse)),
      borderColor: '#4f8ef7', borderWidth: 1.5, pointRadius: 0, tension: tension(),
    }];
    if (epochRecs.length) {
      datasets.push({
        label: 'Val MSE',
        data: epochRecs.map(r => pt(r, r.val_mse)),
        borderColor: '#f76f6f', borderWidth: 2, pointRadius: 3,
        pointBackgroundColor: '#f76f6f', tension: 0.2,
      });
      const stars = epochRecs.filter(r => r.improved);
      if (stars.length) datasets.push({
        label: 'Improved ★',
        data: stars.map(r => pt(r, r.val_mse)),
        borderColor: 'transparent', pointRadius: 6,
        pointBackgroundColor: '#3dd68c', pointStyle: 'star', showLine: false,
      });
    }

    if (lossChart) {
      lossChart.data.datasets = datasets;
      lossChart.update();
    } else {
      lossChart = new Chart(document.getElementById('loss-chart'), {
        type: 'line', data: { datasets },
        options: {
          animation: false, parsing: false,
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { type: 'linear', title: { display: true, text: 'Total batches', color: '#6b7280' }, grid: { color: '#2e3350' }, ticks: { color: '#6b7280' } },
            y: yAxis('MSE'),
          },
          plugins: { ...tooltipPlugin() },
        }
      });
      attachZoom(() => lossChart, document.getElementById('loss-chart'));
    }

    // ── Latest-epoch chart ──
    const latestEpoch   = last?.epoch ?? 1;
    const latestBatches = batchRecs.filter(r => r.epoch === latestEpoch);
    document.getElementById('epoch-chart-title').textContent =
      `Epoch ${latestEpoch} — batch progress`;

    // Destroy and recreate when epoch rolls over so the x-axis resets cleanly.
    if (epochChart && latestEpoch !== epochChartEpoch) {
      epochChart.destroy();
      epochChart = null;
    }
    epochChartEpoch = latestEpoch;

    const epochDs = [{
      label: 'Train MSE',
      data: (useEMA() ? applyEMA(latestBatches) : latestBatches).map(r => ({ x: r.batch, y: toPlot(r.train_mse) })),
      borderColor: '#4f8ef7', borderWidth: 1.5, pointRadius: 0, tension: tension(),
    }];

    if (epochChart) {
      epochChart.data.datasets = epochDs;
      epochChart.update();
    } else {
      epochChart = new Chart(document.getElementById('epoch-chart'), {
        type: 'line', data: { datasets: epochDs },
        options: {
          animation: false, parsing: false,
          responsive: true, maintainAspectRatio: false,
          scales: {
            x: { type: 'linear', title: { display: true, text: 'Batch', color: '#6b7280' }, grid: { color: '#2e3350' }, ticks: { color: '#6b7280' } },
            y: yAxis('MSE'),
          },
          plugins: { ...tooltipPlugin() },
        }
      });
      attachZoom(() => epochChart, document.getElementById('epoch-chart'));
    }
  }

  async function load() {
    const model = document.getElementById('model-name').value.trim();
    const url   = `${LOG_BASE}${model}/epoch_log.jsonl`;
    let text;
    try {
      const resp = await fetch(url + '?_=' + Date.now());
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      text = await resp.text();
    } catch (e) {
      document.getElementById('status-text').textContent = `Error: ${e.message}`;
      document.getElementById('live-dot').className = 'live-dot idle';
      return;
    }
    cachedRecords = dedup(text.trim().split('\n').filter(l => l.trim()).map(l => JSON.parse(l)));
    render(cachedRecords);
  }

  function tick() {
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown <= 0) { countdown = 30; load(); }
  }

  load();
  timer = setInterval(tick, 1000);
</script>
</body>
</html>
