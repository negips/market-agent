<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Training — market-agent</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  .section-title {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .07em;
    margin: 34px 0 12px; display: flex; align-items: center; gap: 10px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .status-bar {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 20px; margin-bottom: 18px;
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .status-live  { background: var(--green); animation: pulse 1.4s infinite; }
  .status-idle  { background: var(--muted); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(61,214,140,.5)} 70%{box-shadow:0 0 0 7px rgba(61,214,140,0)} 100%{box-shadow:0 0 0 0 rgba(61,214,140,0)} }
  .status-label { font-size: 13px; font-weight: 600; color: var(--text); }
  .status-sub { font-size: 11.5px; color: var(--muted); }
  .status-metric { text-align: right; }
  .status-metric .v { font-size: 16px; font-weight: 700; font-family: var(--mono); }
  .status-metric .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .phase-pill {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
    padding: 2px 9px; border-radius: 99px;
  }
  .phase-train  { background: rgba(79,142,247,.15); color: var(--accent); }
  .phase-val    { background: rgba(61,214,140,.15); color: var(--green); }
  .phase-update { background: rgba(245,200,66,.15); color: var(--yellow); }

  .update-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 20px; margin-bottom: 18px; display: flex; align-items: center; gap: 16px;
  }
  .update-bar .label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .update-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .update-fill { height: 100%; background: var(--yellow); border-radius: 99px; transition: width .3s ease; }
  .update-bar .pct { font-family: var(--mono); font-size: 12px; color: var(--yellow); width: 40px; text-align: right; }

  .placeholder {
    background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 40px 24px; text-align: center; color: var(--text-dim); font-size: 13px;
  }
  .placeholder code { display: block; margin-top: 12px; color: var(--accent); font-family: var(--mono); font-size: 12.5px; }

  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 18px;
  }
  .chart-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .chart-sub { font-size: 11.5px; color: var(--muted); }
  .trade-toggle {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .trade-toggle input { accent-color: var(--accent); cursor: pointer; }
  .canvas-wrap { position: relative; height: 260px; margin-top: 14px; }
  .canvas-wrap.small { height: 180px; margin-top: 2px; }

  .subplot-label {
    font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; margin-top: 18px;
  }

  .val-run-bulk-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px;
  }
  .val-run-toggles {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin-top: 8px; max-height: 64px; overflow-y: auto;
  }
  .val-run-chip {
    display: flex; align-items: center; gap: 5px;
    font-size: 10.5px; color: var(--text-dim); white-space: nowrap;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 99px;
    padding: 3px 9px 3px 7px; cursor: pointer; user-select: none;
  }
  .val-run-chip input { display: none; }
  .val-run-chip .chip-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,.2);
  }
  .val-run-chip.chip-off { opacity: .4; text-decoration: line-through; }
  .val-run-bulk {
    font-size: 10.5px; color: var(--accent); cursor: pointer;
    background: none; border: none; padding: 3px 2px; text-decoration: underline;
    text-underline-offset: 2px; white-space: nowrap;
  }

  .two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  .trade-feed { max-height: 320px; overflow-y: auto; }
  .trade-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 4px;
    border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .trade-row:last-child { border-bottom: none; }
  .trade-kind {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0; width: 78px; text-align: center;
  }
  .trade-buy         { background: rgba(61,214,140,.12); color: var(--green); }
  .trade-sell        { background: rgba(245,200,66,.12); color: var(--yellow); }
  .trade-forced_exit { background: rgba(247,111,111,.12); color: var(--red); }
  .trade-date { color: var(--muted); font-size: 10.5px; width: 90px; flex-shrink: 0; font-family: var(--mono); }
  .trade-sym { font-weight: 600; flex: 1; }
  .trade-amt { font-family: var(--mono); color: var(--text-dim); font-size: 11.5px; }

  .pnl-pos { color: var(--green); }
  .pnl-neg { color: var(--red); }

  .param-section-label {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    margin: 16px 0 2px;
  }
  .param-section-label:first-child { margin-top: 0; }
  .param-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px 18px;
  }
  .param-item .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .param-item .v { font-size: 13px; font-family: var(--mono); color: var(--text); margin-top: 2px; }
</style>
</head>
<body>
<script src="assets/nav.js"></script>
<script src="assets/utils.js"></script>

<div class="main">
  <div class="page-header">
    <div class="page-title">Live Training</div>
    <div class="page-subtitle">Watch a PPO training run play out — portfolio value, current holdings, and every buy/sell as they happen</div>
  </div>

  <div class="page-content">
    <div id="content">
      <div class="placeholder" id="placeholder">
        Waiting for a training run…
        <code>julia --project=packages/TradingGame scripts/train_trading_policy.jl</code>
      </div>
    </div>
  </div>
</div>

<script>
Chart.defaults.color           = '#6b7280';
Chart.defaults.borderColor     = '#2e3350';
Chart.defaults.backgroundColor = 'transparent';

const LIVE_URL       = 'data/trading_game/live_status.json';
const LOG_URL        = 'data/trading_game/episode_log.jsonl';
const VAL_RUNS_URL   = 'data/trading_game/val_runs.jsonl';
const RUN_CONFIG_URL = 'data/trading_game/run_config.json';

let shown = false;
let valueChart = null, iterChart = null, valRunsChart = null, valRunsSplitChart = null;
let lastValRuns = [];   // most recent renderValRunsChart(runs) argument — re-rendered on a toggle click, no re-fetch needed

function loadShowTrades() {
  try { return localStorage.getItem('tgLiveShowTrades') !== 'off'; } catch { return true; }
}
function saveShowTrades(v) {
  try { localStorage.setItem('tgLiveShowTrades', v ? 'on' : 'off'); } catch {}
}
function loadShowValTrades() {
  try { return localStorage.getItem('tgValShowTrades') !== 'off'; } catch { return true; }
}
function saveShowValTrades(v) {
  try { localStorage.setItem('tgValShowTrades', v ? 'on' : 'off'); } catch {}
}
// Which validation-run iterations are hidden from the held-out chart, by the
// user's own choice (per-run toggle chips) — not a recency/count-based
// default, so it's keyed by iteration number and persisted across reloads.
function loadHiddenValRuns() {
  try { return new Set(JSON.parse(localStorage.getItem('tgValHiddenRuns') || '[]')); }
  catch { return new Set(); }
}
function saveHiddenValRuns(set) {
  try { localStorage.setItem('tgValHiddenRuns', JSON.stringify([...set])); } catch {}
}
let hiddenValRuns = loadHiddenValRuns();

async function fetchJSON(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch failed: ' + url);
  return r.json();
}

async function fetchJSONL(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch failed: ' + url);
  const text = await r.text();
  return text.trim().split('\n').filter(Boolean).map(l => JSON.parse(l));
}

function fmtRupee(v) {
  if (v == null) return '—';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function fmtTradeStamp(t) {
  const [datePart, timePart] = (t.t && t.t.includes('T')) ? t.t.split('T') : [t.date, null];
  const [y, m, d] = datePart.split('-');
  const dmy = `${d}/${m}/${y.slice(2)}`;
  return timePart ? `${dmy}-${timePart.slice(0, 5)}` : dmy;
}

// Shared row template for both holdings tables — same shape otherwise, but
// the two JSON sources use different keys for the "paid" price column:
// live_status.json's per-lot "holdings" is entry_price (_holdings_snapshot
// in live.jl, one row per lot), val_runs.jsonl's "final_holdings" is
// effective_price (_holdings_snapshot_unified, one row per symbol, weighted
// average across that symbol's lots) — priceKey picks which.
function holdingsRowsHtml(holdings, priceKey) {
  return holdings.length ? holdings.map(h => `
    <tr>
      <td><span class="symbol-chip">${esc(h.symbol)}</span></td>
      <td class="num" style="text-align:center">${h.quantity.toFixed(0)}</td>
      <td class="num" style="text-align:center">${fmtRupee(h[priceKey])}</td>
      <td class="num" style="text-align:center">${fmtRupee(h.current_price)}</td>
      <td class="num" style="text-align:center">${h.days_held}</td>
      <td class="num ${h.unrealized_pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}" style="text-align:center">${fmtRupee(h.unrealized_pnl)} (${h.unrealized_pnl_pct >= 0 ? '+' : ''}${h.unrealized_pnl_pct.toFixed(2)}%)</td>
    </tr>`).join('') : `<tr><td colspan="6" class="na" style="padding:14px">All cash — no open positions</td></tr>`;
}

function revealLayout() {
  if (shown) return;
  shown = true;
  document.getElementById('content').innerHTML = `
    <div class="status-bar" id="status-bar"></div>
    <div class="update-bar" id="update-bar" style="display:none"></div>

    <div class="chart-card" id="run-config-card" style="display:none">
      <div class="chart-header">
        <div class="chart-title">Training configuration</div>
        <div class="chart-sub" id="run-config-sub"></div>
      </div>
      <div id="run-config-body" style="margin-top:4px"></div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Current episode — portfolio value</div>
        <div style="display:flex; align-items:center; gap:14px">
          <div class="chart-sub" id="value-chart-sub"></div>
          <label class="trade-toggle">
            <input type="checkbox" id="show-trades-toggle" checked> Show trades
          </label>
        </div>
      </div>
      <div class="canvas-wrap"><canvas id="value-chart"></canvas></div>
    </div>

    <div class="two-col">
      <div class="chart-card" style="margin-bottom:0">
        <div class="chart-header">
          <div class="chart-title">Holdings</div>
          <div class="chart-sub" id="holdings-sub"></div>
        </div>
        <div class="tbl-wrap" style="margin-top:12px">
          <table class="data-table">
            <thead><tr>
              <th class="no-sort">Symbol</th><th class="no-sort" style="text-align:center">Qty</th>
              <th class="no-sort" style="text-align:center">Entry</th><th class="no-sort" style="text-align:center">Current</th>
              <th class="no-sort" style="text-align:center">Days held</th><th class="no-sort" style="text-align:center">Unrealized P&amp;L</th>
            </tr></thead>
            <tbody id="holdings-body"></tbody>
          </table>
        </div>
      </div>
      <div class="chart-card" style="margin-bottom:0">
        <div class="chart-header">
          <div class="chart-title">Recent decisions</div>
          <div class="chart-sub">Newest first</div>
        </div>
        <div class="trade-feed" id="trade-feed" style="margin-top:8px"></div>
      </div>
    </div>

    <div class="section-title">Training progress</div>
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Episode return per iteration</div>
        <div class="chart-sub" id="iter-chart-sub">Σ log-return · training rollout vs held-out eval</div>
      </div>
      <div class="canvas-wrap"><canvas id="iter-chart"></canvas></div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Held-out validation — portfolio value across runs</div>
        <div style="display:flex; align-items:center; gap:14px">
          <div class="chart-sub" id="val-chart-sub"></div>
          <label class="trade-toggle">
            <input type="checkbox" id="show-val-trades-toggle" checked> Show trades
          </label>
        </div>
      </div>
      <div class="val-run-bulk-row" id="val-run-bulk-row">
        <button type="button" class="val-run-bulk" data-bulk="all">Show all</button>
        <button type="button" class="val-run-bulk" data-bulk="none">Hide all</button>
        <button type="button" class="val-run-bulk" data-bulk="last5">Last 5 only</button>
      </div>
      <div class="val-run-toggles" id="val-run-toggles"></div>
      <div class="subplot-label">Portfolio value</div>
      <div class="canvas-wrap"><canvas id="val-chart"></canvas></div>
      <div class="subplot-label">Portfolio split — stock vs cash</div>
      <div class="canvas-wrap small"><canvas id="val-split-chart"></canvas></div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Final holdings — latest validation run</div>
        <div class="chart-sub" id="val-holdings-sub"></div>
      </div>
      <div class="tbl-wrap" style="margin-top:12px">
        <table class="data-table">
          <thead><tr>
            <th class="no-sort">Symbol</th><th class="no-sort" style="text-align:center">Qty</th>
            <th class="no-sort" style="text-align:center">Effective Price</th><th class="no-sort" style="text-align:center">Current</th>
            <th class="no-sort" style="text-align:center">Days held</th><th class="no-sort" style="text-align:center">Unrealized P&amp;L</th>
          </tr></thead>
          <tbody id="val-holdings-body"></tbody>
        </table>
      </div>
    </div>
  `;

  const toggle = document.getElementById('show-trades-toggle');
  toggle.checked = loadShowTrades();
  toggle.addEventListener('change', () => {
    saveShowTrades(toggle.checked);
    if (!valueChart) return;
    valueChart.data.datasets.forEach((ds, i) => {
      if (ds.label === 'Buy' || ds.label === 'Sell' || ds.label === 'Forced exit')
        valueChart.setDatasetVisibility(i, toggle.checked);
    });
    valueChart.update();
  });

  const valToggle = document.getElementById('show-val-trades-toggle');
  valToggle.checked = loadShowValTrades();
  valToggle.addEventListener('change', () => {
    saveShowValTrades(valToggle.checked);
    if (!valRunsChart) return;
    // Dataset count grows with every new validation run, so the trade-marker
    // datasets aren't at a fixed index like the current-episode chart — find them by label.
    valRunsChart.data.datasets.forEach((ds, i) => {
      if (ds.label === 'Buy' || ds.label === 'Sell' || ds.label === 'Forced exit')
        valRunsChart.setDatasetVisibility(i, valToggle.checked);
    });
    valRunsChart.update();
  });

  // Bulk show/hide/last-5 buttons live in their own static row, outside the
  // chip list's scrollable box (val-run-toggles below) — so they stay put
  // instead of scrolling out of view once enough runs accumulate to need
  // that box's own scrollbar. Static markup (unlike the chips), so this
  // listener is bound once and never re-rendered.
  document.getElementById('val-run-bulk-row').addEventListener('click', (e) => {
    const bulk = e.target.closest('[data-bulk]');
    if (!bulk) return;
    if (bulk.dataset.bulk === 'none') hiddenValRuns = new Set(lastValRuns.map(r => r.iteration));
    else if (bulk.dataset.bulk === 'last5') {
      const keep = new Set(lastValRuns.slice(-5).map(r => r.iteration));
      hiddenValRuns = new Set(lastValRuns.filter(r => !keep.has(r.iteration)).map(r => r.iteration));
    }
    else hiddenValRuns.clear();
    saveHiddenValRuns(hiddenValRuns);
    renderValRunsChart(lastValRuns);
  });

  // Per-run show/hide chips. The chip bar's innerHTML is rebuilt on every
  // renderValRunsChart call (new runs land every eval_every iterations), so
  // this listener is attached once here, delegated, rather than re-bound per
  // render.
  document.getElementById('val-run-toggles').addEventListener('click', (e) => {
    const chip = e.target.closest('[data-iter]');
    if (!chip) return;
    const iter = Number(chip.dataset.iter);
    if (hiddenValRuns.has(iter)) hiddenValRuns.delete(iter);
    else hiddenValRuns.add(iter);
    saveHiddenValRuns(hiddenValRuns);
    renderValRunsChart(lastValRuns);
  });
}

const PHASE_LABEL = { train: 'Training', val: 'Held-out eval', update: 'Updating policy' };
const PHASE_CLASS  = { train: 'phase-train', val: 'phase-val', update: 'phase-update' };

function renderStatus(s) {
  const bar = document.getElementById('status-bar');
  const age = (Date.now() - Date.parse(s.updated_at + 'Z')) / 1000;
  const live = age < 15;
  const pnlPct = s.initial_cash > 0 ? (s.portfolio_value / s.initial_cash - 1) * 100 : 0;
  const pnlCls = pnlPct >= 0 ? 'pnl-pos' : 'pnl-neg';
  bar.innerHTML = `
    <div><span class="status-dot ${live ? 'status-live' : 'status-idle'}"></span>
      <span class="status-label">${live ? 'Live' : 'Idle'}</span>
      <div class="status-sub">updated ${age < 60 ? Math.round(age) + 's ago' : Math.round(age/60) + 'm ago'}</div>
    </div>
    <span class="phase-pill ${PHASE_CLASS[s.phase] || 'phase-train'}">${PHASE_LABEL[s.phase] || s.phase}</span>
    <div class="status-metric"><div class="v">${s.iteration}</div><div class="l">Iteration</div></div>
    <div class="status-metric"><div class="v">${s.current_date}</div><div class="l">Sim. date</div></div>
    <div class="status-metric"><div class="v">${s.n_candidates ?? '—'}</div><div class="l">Universe</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.portfolio_value)}</div><div class="l">Portfolio value</div></div>
    <div class="status-metric"><div class="v ${pnlCls}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</div><div class="l">vs. initial cash</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.cash)}</div><div class="l">Spendable cash</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.reserved_cash)}</div><div class="l">Reserved (settling)</div></div>
  `;

  const updateBar = document.getElementById('update-bar');
  if (s.phase === 'update' && s.update_progress) {
    const p = s.update_progress;
    const pct = p.total_minibatches > 0 ? Math.round(100 * p.minibatch / p.total_minibatches) : 0;
    updateBar.style.display = 'flex';
    updateBar.innerHTML = `
      <div class="label">PPO update · epoch ${p.epoch}/${p.k_epochs} · minibatch ${p.minibatch}/${p.total_minibatches} · loss ${p.loss.toFixed(4)}</div>
      <div class="update-track"><div class="update-fill" style="width:${pct}%"></div></div>
      <div class="pct">${pct}%</div>
    `;
  } else {
    updateBar.style.display = 'none';
  }

  document.getElementById('value-chart-sub').textContent =
    `${s.holdings.length} position${s.holdings.length === 1 ? '' : 's'} held · episode started ${s.episode_started_at}Z`;

  const points      = s.value_curve.map(p => ({ x: p.t, y: p.value }));
  const stockPoints = s.value_curve.map(p => ({ x: p.t, y: p.stocks_value }));
  const cashPoints  = s.value_curve.map(p => ({ x: p.t, y: p.cash_value }));
  const baseline    = s.value_curve.map(p => ({ x: p.t, y: s.initial_cash }));

  // Trades happen on a decision bar, which always has a matching value_curve
  // point at the same timestamp (the trade executes, THEN that bar's
  // portfolio value is marked and recorded) — so every trade maps onto the
  // line exactly, no interpolation needed. A trade whose bar has already
  // aged out of value_curve (shouldn't happen at LIVE_VALUE_CURVE_CAP's size,
  // but defensively) is just dropped rather than plotted at a wrong height.
  const valueByT = new Map(s.value_curve.map(p => [p.t, p.value]));
  const toPoint  = (t) => ({ x: t.t, y: valueByT.get(t.t), trade: t });
  // Voluntary sells and rule-9 forced exits are both "not a buy" but are
  // distinct decisions (one chosen by the policy, one structurally
  // unconditional) — kept as separate marker datasets, not lumped into one
  // "Sell", matching the "Recent decisions" feed's own buy/sell/forced_exit
  // color convention (green/yellow/red).
  const buyPoints    = s.recent_trades.filter(t => t.kind === 'buy').map(toPoint).filter(p => p.y !== undefined);
  const sellPoints   = s.recent_trades.filter(t => t.kind === 'sell').map(toPoint).filter(p => p.y !== undefined);
  const forcedPoints = s.recent_trades.filter(t => t.kind === 'forced_exit').map(toPoint).filter(p => p.y !== undefined);

  if (!valueChart) {
    valueChart = new Chart(document.getElementById('value-chart'), {
      type: 'line',
      data: { datasets: [
        { label: 'Portfolio value', data: points, borderColor: '#4f8ef7', borderWidth: 3, pointRadius: 0, tension: .15 },
        { label: 'Stock value', data: stockPoints, borderColor: 'rgba(79,142,247,.65)', borderWidth: 1.75, pointRadius: 0, tension: .15 },
        { label: 'Cash (incl. reserved)', data: cashPoints, borderColor: 'rgba(79,142,247,.5)', borderDash: [6,3], borderWidth: 1.5, pointRadius: 0, tension: .15 },
        { label: 'Initial cash', data: baseline, borderColor: 'rgba(148,163,184,.4)', borderDash: [4,4], borderWidth: 1.5, pointRadius: 0 },
        { label: 'Buy', data: buyPoints, showLine: false, pointStyle: 'circle',
          pointRadius: 3, pointHoverRadius: 5, backgroundColor: '#3dd68c', borderColor: '#3dd68c',
          hidden: !loadShowTrades() },
        { label: 'Sell', data: sellPoints, showLine: false, pointStyle: 'crossRot',
          pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
          backgroundColor: '#f5c842', borderColor: '#f5c842',
          hidden: !loadShowTrades() },
        { label: 'Forced exit', data: forcedPoints, showLine: false, pointStyle: 'rectRot',
          pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
          backgroundColor: '#f76f6f', borderColor: '#f76f6f',
          hidden: !loadShowTrades() },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'hour', minUnit: 'hour', tooltipFormat: 'MMM d, HH:mm', displayFormats: { hour: 'HH:mm' } },
            title: { display: true, text: 'Date', color: '#6b7280' },
            grid: { color: '#1e2338' },
            ticks: {
              major: { enabled: true },
              font: (ctx) => ctx.tick && ctx.tick.major ? { weight: '600', size: 11 } : { size: 10 },
              color: (ctx) => ctx.tick && ctx.tick.major ? '#94a3b8' : '#6b7280',
            },
          },
          y: { title: { display: true, text: '₹', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 18, boxHeight: 2, color: '#94a3b8', font: { size: 11 } } },
          tooltip: { callbacks: { label: (item) => {
            if (item.raw && item.raw.trade) {
              const t = item.raw.trade;
              return `${t.kind === 'forced_exit' ? 'FORCED EXIT' : t.kind.toUpperCase()} ${t.symbol}: ${t.quantity.toFixed(0)} @ ${fmtRupee(t.price)}`;
            }
            return `${item.dataset.label}: ${fmtRupee(item.parsed.y)}`;
          } } },
        },
      },
    });
  } else {
    valueChart.data.datasets[0].data = points;
    valueChart.data.datasets[1].data = stockPoints;
    valueChart.data.datasets[2].data = cashPoints;
    valueChart.data.datasets[3].data = baseline;
    valueChart.data.datasets[4].data = buyPoints;
    valueChart.data.datasets[5].data = sellPoints;
    valueChart.data.datasets[6].data = forcedPoints;
    valueChart.update('none');
  }

  document.getElementById('holdings-sub').textContent = `Marked at ${s.current_date}`;
  document.getElementById('holdings-body').innerHTML = holdingsRowsHtml(s.holdings, 'entry_price');

  const trades = [...s.recent_trades].reverse();
  document.getElementById('trade-feed').innerHTML = trades.length ? trades.map(t => `
    <div class="trade-row">
      <span class="trade-kind trade-${t.kind}">${t.kind === 'forced_exit' ? 'forced' : t.kind}</span>
      <span class="trade-date">${fmtTradeStamp(t)}</span>
      <span class="trade-sym">${esc(t.symbol)}</span>
      <span class="trade-amt">${t.quantity.toFixed(0)} shares @ ${fmtRupee(t.price)}, for ${fmtRupee(t.notional)}</span>
    </div>`).join('') : `<div class="na" style="padding:14px">No trades yet this episode</div>`;
}

function renderIterChart(rows) {
  const labels = rows.map(r => r.iteration);
  const train  = rows.map(r => r.train_return);
  const val    = rows.map(r => r.val_return);
  const bests = rows.map(r => r.best_return).filter(v => v != null);
  document.getElementById('iter-chart-sub').textContent =
    `${rows.length} iteration${rows.length === 1 ? '' : 's'} logged · best return ${bests.length ? Math.max(...bests).toFixed(4) : '—'}`;
  if (!iterChart) {
    iterChart = new Chart(document.getElementById('iter-chart'), {
      type: 'line',
      data: { labels, datasets: [
        { label: 'Train return', data: train, borderColor: 'rgba(79,142,247,.5)', borderWidth: 1.5, pointRadius: 0, tension: 0 },
        { label: 'Held-out (val) return', data: val, borderColor: '#3dd68c', borderWidth: 2, pointRadius: 2, spanGaps: true },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { title: { display: true, text: 'Iteration', color: '#6b7280' }, grid: { color: '#1e2338' } },
          y: { title: { display: true, text: 'Σ log-return', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 18, boxHeight: 2, color: '#94a3b8', font: { size: 11 } } },
        },
      },
    });
  } else {
    iterChart.data.labels = labels;
    iterChart.data.datasets[0].data = train;
    iterChart.data.datasets[1].data = val;
    iterChart.update('none');
  }
}

// 8-hue CVD-safe categorical order (dataviz skill's default palette, dark-
// surface steps), cycling once more validation runs accumulate than colors
// — every run gets a genuinely distinct hue instead of the old single-green
// gradient, which read as "every line is the same color" once there were
// more than a couple of runs on screen. The per-run toggle chips (see
// `renderValRunsChart`) are what make color collisions past the 8th run
// tolerable: the chip legend always names which iteration a hue belongs to,
// and a colliding pair can just be isolated by hiding everything else.
const VAL_RUN_PALETTE = [
  '#3987e5', // blue
  '#d9823f', // orange
  '#1fc08a', // aqua
  '#d9a62a', // yellow
  '#d55181', // magenta
  '#39c95c', // green
  '#9085e9', // violet
  '#e66767', // red
];

function valRunHue(rank) {
  return VAL_RUN_PALETTE[rank % VAL_RUN_PALETTE.length];
}

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha.toFixed(2)})`;
}

// Hue identifies the run; a small recency dip on top (older runs slightly
// more transparent than the most recent) keeps "which run is newest" legible
// at a glance without it being the only thing distinguishing two lines.
function valRunColor(rank, total) {
  const t = total <= 1 ? 1 : rank / (total - 1);
  const alpha = 0.55 + 0.45 * t;
  return hexToRgba(valRunHue(rank), alpha);
}

function renderValRunsChart(runs) {
  lastValRuns = runs;
  if (!runs.length) {
    document.getElementById('val-chart-sub').textContent = 'No held-out evaluation completed yet';
    document.getElementById('val-run-bulk-row').style.display = 'none';
    document.getElementById('val-run-toggles').innerHTML = '';
    document.getElementById('val-holdings-sub').textContent = '';
    document.getElementById('val-holdings-body').innerHTML = '';
    return;
  }
  document.getElementById('val-run-bulk-row').style.display = '';

  // Always the most recently completed run, regardless of which runs are
  // toggled on/off in the chart above — the chip toggles control chart
  // visibility only, not which run this table describes.
  const latestRun = runs[runs.length - 1];
  document.getElementById('val-holdings-sub').textContent =
    `Iter ${latestRun.iteration} · final value ${fmtRupee(latestRun.final_value)} · ` +
    `return ${latestRun.val_return >= 0 ? '+' : ''}${(latestRun.val_return * 100).toFixed(2)}%`;
  document.getElementById('val-holdings-body').innerHTML = latestRun.final_holdings
    ? holdingsRowsHtml(latestRun.final_holdings, 'effective_price')
    : `<tr><td colspan="6" class="na" style="padding:14px">Not recorded for this run (written before this table was added)</td></tr>`;
  document.getElementById('val-chart-sub').textContent =
    `${runs.length} run${runs.length === 1 ? '' : 's'} · each run its own color ` +
    `(cycles after ${VAL_RUN_PALETTE.length}) · faint = earliest iteration (${runs[0].iteration}), ` +
    `bold = most recent (${runs[runs.length - 1].iteration})`;

  // One chip per run — unchecking it hides that run's 3 lines (and its trade
  // markers, below) without affecting any other run. Stale hidden iterations
  // (a run that's aged out of val_runs.jsonl — doesn't happen today since
  // that file is append-only forever, but defensively) are dropped here so
  // the saved set never grows unboundedly.
  hiddenValRuns = new Set([...hiddenValRuns].filter(it => runs.some(r => r.iteration === it)));
  document.getElementById('val-run-toggles').innerHTML =
    runs.map((run, i) => {
      const off = hiddenValRuns.has(run.iteration);
      return `<label class="val-run-chip ${off ? 'chip-off' : ''}" data-iter="${run.iteration}">
        <input type="checkbox" ${off ? '' : 'checked'}>
        <span class="chip-dot" style="background:${valRunHue(i)}"></span>
        Iter ${run.iteration}
      </label>`;
    }).join('');

  // One line per run on the top (portfolio-value) chart, two on the bottom
  // (stock/cash split) chart — same color per run (valRunColor's cycling
  // palette) on both, so a run reads as the same visual identity across the
  // two linked charts even though its lines live in separate Chart.js
  // instances. A run unchecked in the toggle bar above is marked `hidden`
  // here rather than dropped from the array, so Chart.js's own dataset
  // bookkeeping stays consistent run to run.
  const portfolioDatasets = [];
  const splitDatasets = [];
  runs.forEach((run, i) => {
    const color  = valRunColor(i, runs.length);
    const isLast = i === runs.length - 1;
    const hidden = hiddenValRuns.has(run.iteration);
    portfolioDatasets.push({
      label: `Iter ${run.iteration} — portfolio value`,
      data: run.value_curve.map(p => ({ x: p.t, y: p.value })),
      borderColor: color, borderWidth: isLast ? 3 : 1.6, pointRadius: 0, tension: .15, hidden,
    });
    splitDatasets.push({
      label: `Iter ${run.iteration} — stock value`,
      data: run.value_curve.map(p => ({ x: p.t, y: p.stocks_value })),
      borderColor: color, borderWidth: isLast ? 1.9 : 1, pointRadius: 0, tension: .15, hidden,
    });
    splitDatasets.push({
      label: `Iter ${run.iteration} — cash (incl. reserved)`,
      data: run.value_curve.map(p => ({ x: p.t, y: p.cash_value })),
      borderColor: color, borderDash: [6, 3], borderWidth: isLast ? 1.6 : .9, pointRadius: 0, tension: .15, hidden,
    });
  });

  // Trade markers across every plotted (non-hidden) run at once, each
  // colored to match its own line (via per-point backgroundColor) so a
  // marker is traceable back to its run even without a per-run legend entry.
  // Voluntary sells and rule-9 forced exits are split into separate datasets
  // (not lumped as one "Sell") — same distinction and color convention
  // (yellow/red) as the current-episode chart and the "Recent decisions" feed.
  const showVal = loadShowValTrades();
  const buyPoints = [], sellPoints = [], forcedPoints = [];
  runs.forEach((run, i) => {
    if (hiddenValRuns.has(run.iteration)) return;
    const valueByT = new Map(run.value_curve.map(p => [p.t, p.value]));
    const color = valRunColor(i, runs.length);
    for (const t of run.trades) {
      const y = valueByT.get(t.t);
      if (y === undefined) continue;
      const pt = { x: t.t, y, trade: t, iteration: run.iteration, color };
      if (t.kind === 'buy') buyPoints.push(pt);
      else if (t.kind === 'sell') sellPoints.push(pt);
      else forcedPoints.push(pt);
    }
  });

  const buyDataset = {
    label: 'Buy', data: buyPoints, showLine: false, pointStyle: 'circle',
    pointRadius: 3, pointHoverRadius: 5,
    backgroundColor: (ctx) => ctx.raw?.color || '#3dd68c',
    borderColor: (ctx) => ctx.raw?.color || '#3dd68c',
    hidden: !showVal,
  };
  const sellDataset = {
    label: 'Sell', data: sellPoints, showLine: false, pointStyle: 'crossRot',
    pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
    backgroundColor: (ctx) => ctx.raw?.color || '#f5c842',
    borderColor: '#f5c842',
    hidden: !showVal,
  };
  const forcedDataset = {
    label: 'Forced exit', data: forcedPoints, showLine: false, pointStyle: 'rectRot',
    pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
    backgroundColor: (ctx) => ctx.raw?.color || '#f76f6f',
    borderColor: '#f76f6f',
    hidden: !showVal,
  };

  // Same linked-pair pattern as the current-episode section: the top chart
  // (portfolio value + trade markers) hides its own x-axis labels/title and
  // borrows the bottom chart's (stock/cash split), directly beneath it, so
  // the two read as one panel sharing a single time axis.
  if (!valRunsChart) {
    valRunsChart = new Chart(document.getElementById('val-chart'), {
      type: 'line',
      data: { datasets: [...portfolioDatasets, buyDataset, sellDataset, forcedDataset] },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'day', tooltipFormat: 'MMM d, HH:mm', displayFormats: { day: 'MMM d' } },
            title: { display: false },
            ticks: { display: false },
            grid: { color: '#1e2338' },
          },
          y: { title: { display: true, text: '₹', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          // No legend: dataset count grows unboundedly (one line per
          // validation run) — see valRunColor's comment for why a cycling
          // categorical palette plus the chip bar replaces a legend here.
          legend: { display: false },
          tooltip: { callbacks: { label: (item) => {
            if (item.raw && item.raw.trade) {
              const t = item.raw.trade;
              return `Iter ${item.raw.iteration} · ${t.kind === 'forced_exit' ? 'FORCED EXIT' : t.kind.toUpperCase()} ` +
                     `${t.symbol}: ${t.quantity.toFixed(0)} @ ${fmtRupee(t.price)}`;
            }
            return `${item.dataset.label}: ${fmtRupee(item.parsed.y)}`;
          } } },
        },
      },
    });
  } else {
    // Dataset count itself changes (a new line per run) — rebuild wholesale
    // rather than mutating in place like the fixed-dataset-count charts.
    valRunsChart.data.datasets = [...portfolioDatasets, buyDataset, sellDataset, forcedDataset];
    valRunsChart.update('none');
  }

  if (!valRunsSplitChart) {
    valRunsSplitChart = new Chart(document.getElementById('val-split-chart'), {
      type: 'line',
      data: { datasets: splitDatasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'day', tooltipFormat: 'MMM d, HH:mm', displayFormats: { day: 'MMM d' } },
            title: { display: true, text: 'Held-out window date', color: '#6b7280' },
            grid: { color: '#1e2338' },
          },
          y: { title: { display: true, text: '₹', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (item) => `${item.dataset.label}: ${fmtRupee(item.parsed.y)}` } },
        },
      },
    });
  } else {
    valRunsSplitChart.data.datasets = splitDatasets;
    valRunsSplitChart.update('none');
  }
}

function paramItem(label, value) {
  return `<div class="param-item"><div class="l">${esc(label)}</div><div class="v">${value}</div></div>`;
}

// run_config.json is written once per run (fresh start or --resume) and
// barely changes mid-run — see save_run_config in scripts/train_trading_policy.jl.
// resolved_device/resolved_minibatch/train_*/val_*/rule_constants are all
// informational-only fields added purely for this card; everything else
// here is the RESUMABLE_KEYS subset the script itself reads back on --resume.
function renderRunConfig(cfg) {
  document.getElementById('run-config-card').style.display = '';
  document.getElementById('run-config-sub').textContent =
    `${cfg.n_candidates ?? '—'} candidates · train ${cfg.train_start ?? '—'} → ${cfg.train_end ?? '—'} ` +
    `· val ${cfg.val_start ?? '—'} → ${cfg.val_end ?? '—'}`;

  const rc  = cfg.rule_constants || {};
  const pct = (v) => v == null ? '—' : (v * 100).toFixed(2) + '%';

  document.getElementById('run-config-body').innerHTML = `
    <div class="param-section-label">Run config</div>
    <div class="param-grid">
      ${paramItem('Device', cfg.resolved_device ?? cfg.device ?? '—')}
      ${paramItem('Minibatch', cfg.resolved_minibatch ?? cfg.minibatch ?? '—')}
      ${paramItem('Learning rate', cfg.lr ?? '—')}
      ${paramItem('Entropy coef', cfg.entropy_coef ?? '—')}
      ${paramItem('Eval every', cfg.eval_every != null ? cfg.eval_every + ' iters' : '—')}
      ${paramItem('Val days', cfg.val_days ?? '—')}
      ${paramItem('Initial cash', cfg.initial_cash != null ? fmtRupee(cfg.initial_cash) : '—')}
      ${paramItem('Seed', cfg.seed ?? 'none')}
      ${paramItem('Candidates', cfg.n_candidates ?? '—')}
    </div>

    <div class="param-section-label">Rule-derived constants</div>
    <div class="param-grid">
      ${paramItem('Fee rate', pct(rc.fee_rate))}
      ${paramItem('Settlement days', rc.settlement_days ?? '—')}
      ${paramItem('Min hold days', rc.min_hold_days ?? '—')}
      ${paramItem('Max hold days', rc.max_hold_days ?? '—')}
      ${paramItem('Max position frac.', pct(rc.max_position_fraction))}
      ${paramItem('Max holdings', rc.n_max_holdings != null ? `${rc.n_max_holdings} (${pct(rc.n_max_holdings_fraction)} of universe)` : '—')}
      ${paramItem('Max cash frac.', pct(rc.max_cash_fraction))}
      ${paramItem('Cash ceiling penalty', rc.cash_ceiling_penalty_coef ?? '—')}
      ${paramItem('Rebuy cooldown', rc.rebuy_cooldown_days != null ? rc.rebuy_cooldown_days + ' days' : '—')}
      ${paramItem('Gamma / GAE λ', (rc.gamma ?? '—') + ' / ' + (rc.gae_lambda ?? '—'))}
      ${paramItem('Clip epsilon', rc.clip_eps ?? '—')}
      ${paramItem('Value loss coef', rc.value_loss_coef ?? '—')}
    </div>
  `;
}

async function pollLive() {
  try {
    const s = await fetchJSON(LIVE_URL);
    revealLayout();
    renderStatus(s);
  } catch {
    // no live_status.json yet (or a training run isn't currently active) —
    // leave whatever's on screen (placeholder, or the last good frame).
  }
}

async function pollLog() {
  try {
    const rows = await fetchJSONL(LOG_URL);
    revealLayout();
    renderIterChart(rows);
  } catch { /* no episode_log.jsonl yet */ }
}

async function pollValRuns() {
  try {
    const runs = await fetchJSONL(VAL_RUNS_URL);
    revealLayout();
    renderValRunsChart(runs);
  } catch { /* no val_runs.jsonl yet */ }
}

async function pollRunConfig() {
  try {
    const cfg = await fetchJSON(RUN_CONFIG_URL);
    revealLayout();
    renderRunConfig(cfg);
  } catch { /* no run_config.json yet */ }
}

pollLive(); pollLog(); pollValRuns(); pollRunConfig();
setInterval(pollLive, 3000);
setInterval(pollLog, 8000);
// Held-out runs only land once every eval_every iterations (tens of minutes
// apart in practice), and the file only grows (every run ever completed is
// kept — see save_val_run!'s docstring), so there's no reason to poll it as
// often as the live, per-bar status.
setInterval(pollValRuns, 20000);
// run_config.json is written once per run start/resume and otherwise static
// — polled only so a --resume with changed flags (while this page stays
// open) picks up the new values without a manual refresh.
setInterval(pollRunConfig, 20000);
</script>
