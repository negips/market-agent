<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Training — market-agent</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  .section-title {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .07em;
    margin: 34px 0 12px; display: flex; align-items: center; gap: 10px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .status-bar {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 20px; margin-bottom: 18px;
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .status-live  { background: var(--green); animation: pulse 1.4s infinite; }
  .status-idle  { background: var(--muted); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(61,214,140,.5)} 70%{box-shadow:0 0 0 7px rgba(61,214,140,0)} 100%{box-shadow:0 0 0 0 rgba(61,214,140,0)} }
  .status-label { font-size: 13px; font-weight: 600; color: var(--text); }
  .status-sub { font-size: 11.5px; color: var(--muted); }
  .status-metric { text-align: right; }
  .status-metric .v { font-size: 16px; font-weight: 700; font-family: var(--mono); }
  .status-metric .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .phase-pill {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
    padding: 2px 9px; border-radius: 99px;
  }
  .phase-train  { background: rgba(79,142,247,.15); color: var(--accent); }
  .phase-val    { background: rgba(61,214,140,.15); color: var(--green); }
  .phase-update { background: rgba(245,200,66,.15); color: var(--yellow); }

  .update-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 20px; margin-bottom: 18px; display: flex; align-items: center; gap: 16px;
  }
  .update-bar .label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .update-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .update-fill { height: 100%; background: var(--yellow); border-radius: 99px; transition: width .3s ease; }
  .update-bar .pct { font-family: var(--mono); font-size: 12px; color: var(--yellow); width: 40px; text-align: right; }

  .placeholder {
    background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 40px 24px; text-align: center; color: var(--text-dim); font-size: 13px;
  }
  .placeholder code { display: block; margin-top: 12px; color: var(--accent); font-family: var(--mono); font-size: 12.5px; }

  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 18px;
  }
  .chart-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .chart-sub { font-size: 11.5px; color: var(--muted); }
  .trade-toggle {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .trade-toggle input { accent-color: var(--accent); cursor: pointer; }
  .step-btn {
    width: 22px; height: 22px; line-height: 1; padding: 0; font-size: 14px; cursor: pointer;
    background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); border-radius: 4px;
  }
  .step-btn:hover { color: var(--text); border-color: var(--accent); }
  .trade-toggle select {
    background: var(--surface, transparent); color: var(--text-dim); font: inherit;
    border: 1px solid var(--border, #444); border-radius: 4px; padding: 1px 4px; cursor: pointer;
  }
  .canvas-wrap { position: relative; height: 260px; margin-top: 14px; }
  .canvas-wrap.small { height: 180px; margin-top: 2px; }
  .canvas-wrap.tall  { height: 380px; margin-top: 2px; }

  .subplot-label {
    font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; margin-top: 18px;
  }

  .val-run-bulk-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px;
  }
  .val-run-toggles {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin-top: 8px; max-height: 64px; overflow-y: auto;
  }
  .val-run-chip {
    display: flex; align-items: center; gap: 5px;
    font-size: 10.5px; color: var(--text-dim); white-space: nowrap;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 99px;
    padding: 3px 9px 3px 7px; cursor: pointer; user-select: none;
  }
  .val-run-chip input { display: none; }
  .val-run-chip .chip-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,.2);
  }
  .val-run-chip.chip-off { opacity: .4; text-decoration: line-through; }
  .val-run-bulk {
    font-size: 10.5px; color: var(--accent); cursor: pointer;
    background: none; border: none; padding: 3px 2px; text-decoration: underline;
    text-underline-offset: 2px; white-space: nowrap;
  }

  .two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  .trade-feed { max-height: 320px; overflow-y: auto; }
  .trade-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 4px;
    border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .trade-row:last-child { border-bottom: none; }
  .trade-kind {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0; width: 78px; text-align: center;
  }
  .trade-buy         { background: rgba(61,214,140,.12); color: var(--green); }
  .trade-sell        { background: rgba(245,200,66,.12); color: var(--yellow); }
  .trade-forced_exit { background: rgba(247,111,111,.12); color: var(--red); }
  .trade-hold        { background: rgba(148,163,184,.10); color: var(--muted); }
  .vt-hold td        { color: var(--muted); }
  .trade-date { color: var(--muted); font-size: 10.5px; width: 90px; flex-shrink: 0; font-family: var(--mono); }
  .trade-sym { font-weight: 600; flex: 1; }
  .trade-amt { font-family: var(--mono); color: var(--text-dim); font-size: 11.5px; }

  .pnl-pos { color: var(--green); }
  .pnl-neg { color: var(--red); }

  .param-section-label {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    margin: 16px 0 2px;
  }
  .param-section-label:first-child { margin-top: 0; }
  .param-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px 18px;
  }
  .param-item .l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .param-item .v { font-size: 13px; font-family: var(--mono); color: var(--text); margin-top: 2px; }
  .hp-card summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; }
  .hp-card summary::-webkit-details-marker { display: none; }
  .hp-card summary::before { content: '▸'; color: var(--muted); font-size: 11px; }
  .hp-card[open] summary::before { content: '▾'; }
  .hp-intro { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin: 12px 0 4px; }
  .hp-intro code, .hp-table code { font-family: var(--mono); font-size: 11px; color: var(--text); }
  .hp-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  .hp-table th {
    text-align: left; font-size: 10px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; padding: 6px 10px 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .hp-table td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.55; color: var(--text-dim); }
  .hp-table tr:last-child td { border-bottom: none; }
  .hp-table .hp-name { font-weight: 600; color: var(--text); white-space: nowrap; }
  .hp-table .hp-name small { display: block; font-weight: 400; color: var(--muted); font-family: var(--mono); font-size: 10.5px; margin-top: 2px; }
  .hp-table .hp-val { font-family: var(--mono); color: var(--accent); white-space: nowrap; }
  .hp-note { font-size: 11.5px; color: var(--text-dim); line-height: 1.6; margin-top: 12px; padding: 10px 12px; border-left: 2px solid var(--accent); background: rgba(255,255,255,.02); }
  @media (max-width: 900px) { .hp-table { display: block; overflow-x: auto; } }
  .vt-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 12px 0 6px; font-size: 12px; color: var(--text-dim); }
  .vt-controls select, .vt-controls input[type=text] {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 12px;
  }
  .vt-controls input[type=text] { width: 110px; }
  .vt-summary { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 12px; color: var(--text-dim); margin: 8px 0 4px; }
  .vt-summary b { color: var(--text); font-family: var(--mono); font-weight: 600; }
  .vt-scroll { max-height: 520px; overflow: auto; margin-top: 8px; }
  .vt-scroll table.data-table thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .vt-scroll table.data-table tbody td { padding: 6px 12px; font-size: 12px; text-align: center; font-family: var(--mono); white-space: nowrap; }
  .vt-scroll table.data-table tbody td:first-child { text-align: left; }
  .vt-derived { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<script src="assets/nav.js"></script>
<script src="assets/utils.js"></script>

<div class="main">
  <div class="page-header">
    <div class="page-title">Live Training</div>
    <div class="page-subtitle">Watch a PPO training run play out — portfolio value, current holdings, and every buy/sell as they happen</div>
  </div>

  <div class="page-content">
    <div id="content">
      <div class="placeholder" id="placeholder">
        Waiting for a training run…
        <code>julia --project=packages/TradingGame scripts/train_trading_policy.jl</code>
      </div>
    </div>
  </div>
</div>

<script>
Chart.defaults.color           = '#6b7280';
Chart.defaults.borderColor     = '#2e3350';
Chart.defaults.backgroundColor = 'transparent';

const LIVE_URL       = 'data/trading_game/live_status.json';
const LOG_URL        = 'data/trading_game/episode_log.jsonl';
const VAL_RUNS_URL   = 'data/trading_game/val_runs.jsonl';
const RUN_CONFIG_URL = 'data/trading_game/run_config.json';

let shown = false;
let valueChart = null, iterChart = null, iterValChart = null, valRunsChart = null, valRunsSplitChart = null, valDistChart = null;
let initialCash = null;   // from run_config.json — the denominator for the validation-return distribution
let lastValRuns = [];   // most recent renderValRunsChart(runs) argument — re-rendered on a toggle click, no re-fetch needed

function loadShowTrades() {
  try { return localStorage.getItem('tgLiveShowTrades') !== 'off'; } catch { return true; }
}
function saveShowTrades(v) {
  try { localStorage.setItem('tgLiveShowTrades', v ? 'on' : 'off'); } catch {}
}
const VAL_DIST_BIN_PCT = 1;        // histogram bin width, in percentage points
const VAL_DIST_MIN_RECENT = 5;   // smallest "last N" window on the slider; slider max = all runs (stored as 0)
let valDistRecentN = 0;
function loadValDistRecent() {
  try {
    const v = localStorage.getItem('tgValDistRecent');
    if (v === 'on') return 50;   // legacy checkbox value
    const n = parseInt(v, 10);
    return n >= VAL_DIST_MIN_RECENT ? n : 0;
  } catch { return 0; }
}
function saveValDistRecent(n) {
  try { localStorage.setItem('tgValDistRecent', String(n)); } catch {}
}
const VAL_DIST_SKIP_RUNS = 50;     // warm-up runs dropped when the "Skip first 50" toggle is on
function loadValDistSkip() {
  try { return localStorage.getItem('tgValDistSkip') === 'on'; } catch { return false; }
}
function saveValDistSkip(v) {
  try { localStorage.setItem('tgValDistSkip', v ? 'on' : 'off'); } catch {}
}
function loadShowValTrades() {
  try { return localStorage.getItem('tgValShowTrades') !== 'off'; } catch { return true; }
}
function saveShowValTrades(v) {
  try { localStorage.setItem('tgValShowTrades', v ? 'on' : 'off'); } catch {}
}
// Which validation-run iterations are hidden from the held-out chart, by the
// user's own choice (per-run toggle chips) — not a recency/count-based
// default, so it's keyed by iteration number and persisted across reloads.
function loadHiddenValRuns() {
  try { return new Set(JSON.parse(localStorage.getItem('tgValHiddenRuns') || '[]')); }
  catch { return new Set(); }
}
function saveHiddenValRuns(set) {
  try { localStorage.setItem('tgValHiddenRuns', JSON.stringify([...set])); } catch {}
}
let hiddenValRuns = loadHiddenValRuns();

async function fetchJSON(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch failed: ' + url);
  return r.json();
}

async function fetchJSONL(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch failed: ' + url);
  const text = await r.text();
  return text.trim().split('\n').filter(Boolean).map(l => JSON.parse(l));
}

function fmtRupee(v) {
  if (v == null) return '—';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function fmtTradeStamp(t) {
  const [datePart, timePart] = (t.t && t.t.includes('T')) ? t.t.split('T') : [t.date, null];
  const [y, m, d] = datePart.split('-');
  const dmy = `${d}/${m}/${y.slice(2)}`;
  return timePart ? `${dmy}-${timePart.slice(0, 5)}` : dmy;
}

// Shared row template for both holdings tables — same shape otherwise, but
// the two JSON sources use different keys for the "paid" price column:
// live_status.json's per-lot "holdings" is entry_price (_holdings_snapshot
// in live.jl, one row per lot), val_runs.jsonl's "final_holdings" is
// effective_price (_holdings_snapshot_unified, one row per symbol, weighted
// average across that symbol's lots) — priceKey picks which.
function holdingsRowsHtml(holdings, priceKey) {
  return holdings.length ? holdings.map(h => `
    <tr>
      <td><span class="symbol-chip">${esc(h.symbol)}</span></td>
      <td class="num" style="text-align:center">${h.quantity.toFixed(0)}</td>
      <td class="num" style="text-align:center">${fmtRupee(h[priceKey])}</td>
      <td class="num" style="text-align:center">${fmtRupee(h.current_price)}</td>
      <td class="num" style="text-align:center">${h.days_held}</td>
      <td class="num ${h.unrealized_pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}" style="text-align:center">${fmtRupee(h.unrealized_pnl)} (${h.unrealized_pnl_pct >= 0 ? '+' : ''}${h.unrealized_pnl_pct.toFixed(2)}%)</td>
    </tr>`).join('') : `<tr><td colspan="6" class="na" style="padding:14px">All cash — no open positions</td></tr>`;
}

function revealLayout() {
  if (shown) return;
  shown = true;
  document.getElementById('content').innerHTML = `
    <div class="status-bar" id="status-bar"></div>
    <div class="update-bar" id="update-bar" style="display:none"></div>

    <div class="chart-card" id="run-config-card" style="display:none">
      <div class="chart-header">
        <div class="chart-title">Training configuration</div>
        <div class="chart-sub" id="run-config-sub"></div>
      </div>
      <div id="run-config-body" style="margin-top:4px"></div>
    </div>

    <details class="chart-card hp-card" id="hp-card">
      <summary>
        <div class="chart-title">PPO hyperparameters explained</div>
        <div class="chart-sub">what each knob does and which way to turn it</div>
      </summary>

      <div class="hp-intro">
        One <b>iteration</b> = one full training episode played with the current policy
        (every decision bar of the train window; the sampled actions, rewards and critic values are
        stored), followed by an update on that data: advantages are computed with <b>GAE</b>,
        normalised to zero mean / unit std across the episode, and the policy is trained for
        <code>K</code> passes of shuffled minibatches on the <b>clipped PPO objective</b>:
        <code>loss = −min(r·A, clip(r, 1−ε, 1+ε)·A) + c<sub>v</sub>·(V − return)² − c<sub>e</sub>·entropy</code>,
        where <code>r</code> is the new/old probability ratio of the actions that were taken.
        The action log-probability and entropy are <i>summed over all candidate stocks</i>, so a
        step's single advantage is shared by every candidate's decision in that step.
      </div>

      <table class="hp-table">
        <thead><tr><th>Parameter</th><th>This run</th><th>What it does</th><th>Turning it up / down</th></tr></thead>
        <tbody>
          <tr>
            <td class="hp-name">Learning rate<small>--lr · Adam</small></td>
            <td class="hp-val" id="hp-lr">—</td>
            <td>Size of each gradient step for the whole network (actor and critic share one optimiser).
                There is no schedule and no gradient clipping.</td>
            <td>Higher learns faster but can destabilise the policy (val return swings, entropy collapses suddenly).
                Lower is steadier but slow. Lower it when resuming or warm-starting from a good checkpoint.</td>
          </tr>
          <tr>
            <td class="hp-name">Minibatch<small>--minibatch</small></td>
            <td class="hp-val" id="hp-minibatch">—</td>
            <td>Decision steps per gradient update. Each epoch shuffles the episode's steps and slices them into
                minibatches, so updates per iteration = <code>K × ⌈steps / minibatch⌉</code>.</td>
            <td>Smaller means more, noisier updates per iteration (and slower on GPU). Larger means fewer, smoother
                updates; pair with a slightly higher learning rate.</td>
          </tr>
          <tr>
            <td class="hp-name">PPO epochs K<small>fixed default</small></td>
            <td class="hp-val" id="hp-k">4</td>
            <td>How many times the same rollout is reused for updates. Not a command-line flag; set by
                <code>DEFAULT_K_EPOCHS</code> in <code>train.jl</code>.</td>
            <td>More reuse extracts more from each expensive episode but lets the policy drift further from the one
                that collected the data, where the clip is the only safeguard. There is no KL early stop.</td>
          </tr>
          <tr>
            <td class="hp-name">Clip ε<small>CLIP_EPS</small></td>
            <td class="hp-val" id="hp-clip">—</td>
            <td>Trust region: the probability ratio is clamped to <code>[1−ε, 1+ε]</code>, so once an action has become
                ε more (or less) likely there is no extra gradient reward for pushing further.</td>
            <td>Smaller is more conservative and stable. Larger allows bigger policy changes per iteration and risks
                collapse. 0.1–0.3 is the usual range.</td>
          </tr>
          <tr>
            <td class="hp-name">Discount γ<small>GAMMA</small></td>
            <td class="hp-val" id="hp-gamma">—</td>
            <td>Per-<i>bar</i> discount on future reward (bars are hourly, ~7 per trading day). Effective horizon
                <code>1/(1−γ)</code> bars; at 0.99 a reward one week ahead (~49 bars) still counts ~60%, and one at the
                max-hold limit (~98 bars) ~37%.</td>
            <td>Lower makes the agent short-sighted; it would undervalue holding for the full hold period.
                Higher values the long run but raise variance. Keep the horizon at least as long as the max hold.</td>
          </tr>
          <tr>
            <td class="hp-name">GAE λ<small>GAE_LAMBDA</small></td>
            <td class="hp-val" id="hp-lambda">—</td>
            <td>Bias/variance dial for the advantage estimate. λ=0 trusts the critic one step ahead (low variance, biased
                by critic errors); λ=1 uses the actual rewards to the episode end (unbiased, very noisy). Credit from a
                reward fades by <code>(γλ)</code> per bar, an effective horizon of <code>1/(1−γλ)</code> ≈
                <span id="hp-gl-horizon">—</span> bars.</td>
            <td>The reward is paid at the end of each reward window, much further out than that horizon, so early bars of a
                window are credited mostly through the critic. Raising λ passes more of the real window return back
                to those bars at the cost of noise.</td>
          </tr>
          <tr>
            <td class="hp-name">Value loss coef<small>VALUE_LOSS_COEF</small></td>
            <td class="hp-val" id="hp-vf">—</td>
            <td>Weight of the critic's squared error against the actor's policy loss in the combined loss. The critic
                predicts the discounted return; it supplies the baseline in every advantage.</td>
            <td>Higher fits the critic faster, which helps when advantages look like noise, but can dominate shared layers
                and starve the policy. Lower does the opposite.</td>
          </tr>
          <tr>
            <td class="hp-name">Entropy coef<small>--entropy</small></td>
            <td class="hp-val" id="hp-entropy">—</td>
            <td>Bonus for keeping the per-candidate buy/hold/sell distribution spread out. Entropy is summed over all
                candidates, so its pull grows with universe size.</td>
            <td>Higher keeps exploring longer (noisier rollouts, slower convergence). Lower lets the policy commit sooner
                and risks locking into "do nothing". If entropy in the iteration chart collapses early, raise it.</td>
          </tr>
          <tr>
            <td class="hp-name">Eval every<small>--eval-every</small></td>
            <td class="hp-val" id="hp-eval">—</td>
            <td>Run a greedy (argmax-action) episode on the held-out validation window every N iterations. The
                validation return drives checkpointing.</td>
            <td>Smaller gives a finer picture and a denser distribution chart but costs a full episode each time.</td>
          </tr>
        </tbody>
      </table>

      <div class="hp-note">
        Fixed rather than tunable: advantage normalisation (always on), the optimiser (Adam), and
        no gradient clipping. The reward itself (weekly windowed log-return minus the cash-ceiling penalty) is
        set by constants in <code>constants.jl</code>, listed under <i>Rule-derived constants</i> above.
      </div>
    </details>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Current episode — portfolio value</div>
        <div style="display:flex; align-items:center; gap:14px">
          <div class="chart-sub" id="value-chart-sub"></div>
          <label class="trade-toggle">
            <input type="checkbox" id="show-trades-toggle" checked> Show trades
          </label>

    saveHiddenValRuns(hiddenValRuns);
    renderValRunsChart(lastValRuns);
  });
  const stepRunsRange = (delta) => {
    runsRange.value = Math.min(parseInt(runsRange.max, 10), Math.max(1, parseInt(runsRange.value, 10) + delta));
    runsRange.dispatchEvent(new Event('input'));

  document.getElementById('val-runs-recent-minus').addEventListener('click', () => stepRunsRange(-1));
  document.getElementById('val-runs-recent-plus').addEventListener('click', () => stepRunsRange(1));

  // Per-run show/hide chips. The chip bar's innerHTML is rebuilt on every
  // renderValRunsChart call (new runs land every eval_every iterations), so
  // this listener is attached once here, delegated, rather than re-bound per
  // render.
  document.getElementById('val-run-toggles').addEventListener('click', (e) => {
    const chip = e.target.closest('[data-iter]');
    if (!chip) return;
    const iter = Number(chip.dataset.iter);
    if (hiddenValRuns.has(iter)) hiddenValRuns.delete(iter);
    else hiddenValRuns.add(iter);
    saveHiddenValRuns(hiddenValRuns);
    renderValRunsChart(lastValRuns);

}

// ── Validation trades table ────────────────────────────────────────────────────
// Runs written before trade P&L/probabilities were logged carry only price/qty/fee;
// for those, realised P&L is derived here by matching each exit to the earliest
// still-open buy of the same symbol (the simulator closes a lot whole, and a
// symbol's lots exit oldest-first by hold clock), shown italic. Probabilities
// are simply absent (—) for such runs — they can't be reconstructed.
let valTradesIter = null;   // selected run's iteration; null = follow the latest
let valTradesSig  = '';     // what the table was last rendered for, to skip no-op re-renders

function valTradesRows(run) {
  const open = {};
  // trading-day index per date, from the run's own bar timestamps (the simulator
  // counts holds in trading days, not calendar days)
  const dayIdx = new Map();
  for (const p of run.value_curve || []) { const d = p.t.slice(0, 10); if (!dayIdx.has(d)) dayIdx.set(d, dayIdx.size); }
  const hasFields = (run.trades || []).some(t => t.pnl != null);
  return (run.trades || []).map(t => {
    const row = { ...t, derived: false };
    if (!hasFields) {
      const q = open[t.symbol] || (open[t.symbol] = []);
      if (t.kind === 'buy') { q.push(t); row.entry_price = t.price; }
      else {
        const b = q.shift();
        if (b) {
          const cost = t.quantity * b.price + b.fee;
          row.entry_price = b.price;
          row.pnl = t.notional - t.fee - cost;
          row.ret = row.pnl / cost;
          row.days_held = dayIdx.has(t.date) && dayIdx.has(b.date) ? dayIdx.get(t.date) - dayIdx.get(b.date) : null;
          row.derived = true;
        }
      }
    }
    return row;
  });
}

const KIND_LABEL = { buy: 'Buy', sell: 'Sell', forced_exit: 'Forced exit', hold: 'No action' };

// Every decision bar of the run, in order, as the table sees it: the trades, plus
// (when asked) one "No action" row for each bar of the run's value curve on which
// nothing traded — the curve has one point per decision bar, trade or not. Each
// row also carries the portfolio value and cash share after that bar and, when the
// run's per-bar log (`steps`, see `ensureValSteps`) exists, the critic value, picks
// and penalty; a no-action row gets the mean probabilities and the top buy
// candidate from it too.
function valTradesTimeline(run, includeNoAction, steps) {
  const trades = valTradesRows(run);
  const curve = run.value_curve || [];
  const at = new Map(curve.map(p => [p.t, p]));
  const stepAt = new Map();
  if (steps) steps.t.forEach((t, i) => stepAt.set(t, i));
  const withBook = (row) => {
    const p = at.get(row.t);
    const i = stepAt.get(row.t);
    const out = { ...row, portfolio: p ? p.value : null, cash_share: p && p.value > 0 ? p.cash_value / p.value : null };
    if (i != null) {
      out.v = steps.v[i]; out.pen = steps.pen[i];
      out.pick_b = steps.n_pick_buy[i]; out.pick_s = steps.n_pick_sell[i];
    }
    return out;
  };
  const rows = trades.map(withBook);
  if (!includeNoAction) return rows;
  const traded = new Set(trades.map(t => t.t));
  const holds = curve.filter(p => !traded.has(p.t)).map(p => {
    const row = withBook({ kind: 'hold', t: p.t, date: p.t.slice(0, 10), symbol: '' });
    const i = stepAt.get(p.t);
    if (i != null) {
      row.p_hold = steps.ph[i]; row.p_sell = steps.ps[i]; row.p_buy = steps.pb[i];
      row.top_buy = `${steps.symbols[steps.mbs[i] - 1]} ${(steps.mb[i] * 100).toFixed(1)}%`;
    }
    return row;
  });
  return rows.concat(holds).sort((a, b) => a.t < b.t ? -1 : a.t > b.t ? 1 : 0);
}

// Per-bar summaries written by the trainer next to each validation run
// (val_steps/iter_NNNNN.json): mean/top probabilities, critic value, picks and
// penalty for EVERY decision bar, which is what fills in the no-action rows.
// undefined = not requested yet, null = none for that run (older runs, or logging off).
const valStepsCache = new Map();
function ensureValSteps(iteration) {
  if (valStepsCache.has(iteration)) return;
  valStepsCache.set(iteration, undefined);
  const url = `data/trading_game/val_steps/iter_${String(iteration).padStart(5, '0')}.json`;
  fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.ok ? r.json() : null).catch(() => null)
    .then(j => { valStepsCache.set(iteration, j); if (iteration === valTradesIter) renderValTrades(true); });
}
const VT_CHUNK = 1000;   // rows rendered at a time; more are appended as the table is scrolled
let vtMatched = [], vtShown = 0, vtRowHtml = () => '';
const vtNum = (v, d = 2) => v == null ? '—' : v.toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
const vtProb = (p) => (p == null || p < 0) ? '—' : (p * 100).toFixed(1) + '%';

function renderValTrades(force = false) {
  const runs = lastValRuns;
  const sel = document.getElementById('val-trades-run');
  if (!sel) return;
  if (!runs.length) {
    document.getElementById('val-trades-sub').textContent = 'No held-out evaluation completed yet';
    sel.innerHTML = ''; document.getElementById('val-trades-body').innerHTML = '';
    document.getElementById('val-trades-summary').innerHTML = '';
    return;
  }
  if (valTradesIter == null || !runs.some(r => r.iteration === valTradesIter)) valTradesIter = runs[runs.length - 1].iteration;
  const kind = document.getElementById('val-trades-kind').value;
  const symq = document.getElementById('val-trades-symbol').value.trim().toUpperCase();
  const incNo = document.getElementById('val-trades-noaction').checked || kind === 'hold';
  ensureValSteps(valTradesIter);
  const stepsData = valStepsCache.get(valTradesIter);
  const sig = `${runs.length}|${valTradesIter}|${kind}|${symq}|${incNo}|${stepsData === undefined ? 'loading' : stepsData ? 'steps' : 'nosteps'}`;
  if (!force && sig === valTradesSig) return;
  valTradesSig = sig;

  sel.innerHTML = runs.slice().reverse().map(r =>
    `<option value="${r.iteration}" ${r.iteration === valTradesIter ? 'selected' : ''}>Iter ${r.iteration} · ${r.val_return >= 0 ? '+' : ''}${(r.val_return * 100).toFixed(2)}%</option>`).join('');

  const run  = runs.find(r => r.iteration === valTradesIter);
  const timeline = valTradesTimeline(run, incNo, stepsData);
  const all  = timeline.filter(t => t.kind !== 'hold');
  const nHold = timeline.length - all.length;
  const matched = timeline.filter(t =>
    (kind === 'all' || (kind === 'exits' ? t.kind !== 'buy' && t.kind !== 'hold' : t.kind === kind)) &&
    (!symq || (t.symbol || '').toUpperCase().includes(symq)));

  const buys = all.filter(t => t.kind === 'buy').length;
  const vol  = all.filter(t => t.kind === 'sell').length;
  const frc  = all.filter(t => t.kind === 'forced_exit').length;
  const closed = all.filter(t => t.kind !== 'buy' && t.pnl != null);
  const wins = closed.filter(t => t.pnl > 0).length;
  const totPnl = closed.reduce((a, t) => a + t.pnl, 0);
  const avgRet = closed.length ? closed.reduce((a, t) => a + t.ret, 0) / closed.length : null;
  const pSellExits = all.filter(t => t.kind !== 'buy' && t.p_sell != null && t.p_sell >= 0);
  const avgPSell = pSellExits.length ? pSellExits.reduce((a, t) => a + t.p_sell, 0) / pSellExits.length : null;
  const nBars = (run.value_curve || []).length;
  document.getElementById('val-trades-sub').textContent =
    `Iter ${run.iteration} · ${all.length} trades` + (incNo ? ` + ${nHold} bars with no action` : '') +
    ` · chronological` + (incNo && stepsData === null ? ' · no per-bar probabilities logged for this run' : '') +
    (incNo && stepsData === undefined ? ' · loading per-bar log…' : '');
  document.getElementById('val-trades-summary').innerHTML = [
    `Buys <b>${buys}</b>`, `Voluntary sells <b>${vol}</b>`, `Forced exits <b>${frc}</b>`,
    `Bars with no action <b>${nBars ? nBars - new Set(all.map(t => t.t)).size : '—'}</b> of <b>${nBars || '—'}</b>`,
    `Round trips <b>${closed.length}</b> · win rate <b>${closed.length ? (100 * wins / closed.length).toFixed(1) + '%' : '—'}</b>`,
    `Realised P&amp;L <b class="${totPnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${fmtRupee(totPnl)}</b>`,
    `Avg return / trip <b>${avgRet == null ? '—' : (avgRet * 100).toFixed(2) + '%'}</b>`,
    `Avg p(sell) at exits <b>${avgPSell == null ? '—' : (avgPSell * 100).toFixed(1) + '%'}</b>`,
  ].map(x => `<span>${x}</span>`).join('');

  const pct1 = (p) => p == null ? '—' : (p * 100).toFixed(1) + '%';
  vtRowHtml = (t) => {
    const book = `<td>${t.portfolio == null ? '—' : fmtRupee(t.portfolio)}</td><td>${t.cash_share == null ? '—' : (t.cash_share * 100).toFixed(0) + '%'}</td>`;
    const bar = `<td>${t.v == null ? '—' : t.v.toFixed(3)}</td><td>${t.pen ? t.pen.toFixed(3) : (t.pen === 0 ? '0' : '—')}</td>`;
    const picks = `<td>${t.pick_b == null ? '—' : t.pick_b + ' / ' + t.pick_s}</td>`;
    if (t.kind === 'hold') {
      return `<tr class="vt-hold">
      <td>${esc(fmtTradeStamp(t))}</td>
      <td><span class="trade-kind trade-hold">No action</span></td>
      <td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>
      <td>${pct1(t.p_hold)}</td><td>${pct1(t.p_sell)}</td><td>${pct1(t.p_buy)}</td><td>${t.top_buy ? esc(t.top_buy) : '—'}</td>
      ${picks}${bar}${book}
    </tr>`;
    }
    const isExit = t.kind !== 'buy';
    const d = t.derived ? ' vt-derived' : '';
    return `<tr>
      <td>${esc(fmtTradeStamp(t))}</td>
      <td><span class="trade-kind trade-${esc(t.kind)}">${esc(KIND_LABEL[t.kind] || t.kind)}</span></td>
      <td style="font-weight:600">${esc(t.symbol)}</td>
      <td>${vtNum(t.price)}</td><td>${vtNum(t.quantity, 0)}</td><td>${fmtRupee(t.notional)}</td>
      <td>${vtNum(t.fee)}</td>
      <td class="${d}">${isExit && t.entry_price != null ? vtNum(t.entry_price) : '—'}</td>
      <td class="${d}">${isExit && t.days_held != null ? t.days_held : '—'}</td>
      <td class="${isExit && t.pnl != null ? (t.pnl >= 0 ? 'pnl-pos' : 'pnl-neg') : ''}${d}">${isExit && t.pnl != null ? fmtRupee(t.pnl) : '—'}</td>
      <td class="${isExit && t.ret != null ? (t.ret >= 0 ? 'pnl-pos' : 'pnl-neg') : ''}${d}">${isExit && t.ret != null ? (t.ret * 100).toFixed(2) + '%' : '—'}</td>
      <td>${vtProb(t.p_hold)}</td><td>${vtProb(t.p_sell)}</td><td>${vtProb(t.p_buy)}</td><td>—</td>
      ${picks}${bar}${book}
    </tr>`;
  };
  vtMatched = matched; vtShown = 0;
  const body = document.getElementById('val-trades-body');
  body.innerHTML = '';
  if (!matched.length) body.innerHTML = `<tr><td colspan="20" class="na" style="padding:14px">No rows match</td></tr>`;
  appendValTradeRows();
  document.querySelector('#val-trades-card .vt-scroll').scrollTop = 0;
}

// Rows are rendered a chunk at a time and the next chunk is appended as the table is
// scrolled near its end, so a year of 15-minute bars (~6,000 rows) opens instantly
// and every row is still reachable.
function appendValTradeRows() {
  if (vtShown >= vtMatched.length) return;
  const next = vtMatched.slice(vtShown, vtShown + VT_CHUNK);
  document.getElementById('val-trades-body').insertAdjacentHTML('beforeend', next.map(vtRowHtml).join(''));
  vtShown += next.length;
  const sub = document.getElementById('val-trades-sub');
  sub.dataset.more = vtShown < vtMatched.length ? ` · showing ${vtShown} of ${vtMatched.length} rows, scroll for more` : '';
  sub.textContent = sub.textContent.replace(/ · showing .*$/, '') + sub.dataset.more;
}

function downloadValTradesCsv() {
  const run = lastValRuns.find(r => r.iteration === valTradesIter);
  if (!run) return;
  const cols = ['t', 'kind', 'symbol', 'price', 'quantity', 'notional', 'fee', 'entry_price', 'days_held', 'pnl', 'ret', 'p_hold', 'p_sell', 'p_buy', 'top_buy', 'pick_b', 'pick_s', 'v', 'pen', 'portfolio', 'cash_share'];
  const incNo = document.getElementById('val-trades-noaction').checked;
  const csv = [cols.join(',')].concat(valTradesTimeline(run, incNo, valStepsCache.get(run.iteration)).map(t => cols.map(c => t[c] == null ? '' : t[c]).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `val_trades_iter${run.iteration}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function wireValTrades() {
  document.getElementById('val-trades-run').addEventListener('change', e => { valTradesIter = Number(e.target.value); renderValTrades(); });
  document.getElementById('val-trades-kind').addEventListener('change', () => renderValTrades());
  document.getElementById('val-trades-symbol').addEventListener('input', () => renderValTrades());
  document.getElementById('val-trades-noaction').addEventListener('change', () => renderValTrades());
  const vtScroll = document.querySelector('#val-trades-card .vt-scroll');
  vtScroll.addEventListener('scroll', () => {
    if (vtScroll.scrollTop + vtScroll.clientHeight > vtScroll.scrollHeight - 600) appendValTradeRows();
  });
  document.getElementById('val-trades-csv').addEventListener('click', downloadValTradesCsv);
}

const PHASE_LABEL = { train: 'Training', val: 'Held-out eval', update: 'Updating policy' };
const PHASE_CLASS  = { train: 'phase-train', val: 'phase-val', update: 'phase-update' };

function renderStatus(s) {
  const bar = document.getElementById('status-bar');
  const age = (Date.now() - Date.parse(s.updated_at + 'Z')) / 1000;
  const live = age < 15;
  const pnlPct = s.initial_cash > 0 ? (s.portfolio_value / s.initial_cash - 1) * 100 : 0;
  const pnlCls = pnlPct >= 0 ? 'pnl-pos' : 'pnl-neg';
  bar.innerHTML = `
    <div><span class="status-dot ${live ? 'status-live' : 'status-idle'}"></span>
      <span class="status-label">${live ? 'Live' : 'Idle'}</span>
      <div class="status-sub">updated ${age < 60 ? Math.round(age) + 's ago' : Math.round(age/60) + 'm ago'}</div>
    </div>
    <span class="phase-pill ${PHASE_CLASS[s.phase] || 'phase-train'}">${PHASE_LABEL[s.phase] || s.phase}</span>
    <div class="status-metric"><div class="v">${s.iteration}</div><div class="l">Iteration</div></div>
    <div class="status-metric"><div class="v">${s.current_date}</div><div class="l">Sim. date</div></div>
    <div class="status-metric"><div class="v">${s.n_candidates ?? '—'}</div><div class="l">Universe</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.portfolio_value)}</div><div class="l">Portfolio value</div></div>
    <div class="status-metric"><div class="v ${pnlCls}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</div><div class="l">vs. initial cash</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.cash)}</div><div class="l">Spendable cash</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.reserved_cash)}</div><div class="l">Reserved (settling)</div></div>
  `;

  const updateBar = document.getElementById('update-bar');
  if (s.phase === 'update' && s.update_progress) {
    const p = s.update_progress;
    const pct = p.total_minibatches > 0 ? Math.round(100 * p.minibatch / p.total_minibatches) : 0;
    updateBar.style.display = 'flex';
    updateBar.innerHTML = `
      <div class="label">PPO update · epoch ${p.epoch}/${p.k_epochs} · minibatch ${p.minibatch}/${p.total_minibatches} · loss ${p.loss.toFixed(4)}</div>
      <div class="update-track"><div class="update-fill" style="width:${pct}%"></div></div>
      <div class="pct">${pct}%</div>
    `;
  } else {
    updateBar.style.display = 'none';
  }

  document.getElementById('value-chart-sub').textContent =
    `${s.holdings.length} position${s.holdings.length === 1 ? '' : 's'} held · episode started ${s.episode_started_at}Z`;

  const points      = s.value_curve.map(p => ({ x: p.t, y: p.value }));
  const stockPoints = s.value_curve.map(p => ({ x: p.t, y: p.stocks_value }));
  const cashPoints  = s.value_curve.map(p => ({ x: p.t, y: p.cash_value }));
  const baseline    = s.value_curve.map(p => ({ x: p.t, y: s.initial_cash }));

  // Trades happen on a decision bar, which always has a matching value_curve
  // point at the same timestamp (the trade executes, THEN that bar's
  // portfolio value is marked and recorded) — so every trade maps onto the
  // line exactly, no interpolation needed. A trade whose bar has already
  // aged out of value_curve (shouldn't happen at LIVE_VALUE_CURVE_CAP's size,
  // but defensively) is just dropped rather than plotted at a wrong height.
  const valueByT = new Map(s.value_curve.map(p => [p.t, p.value]));
  const toPoint  = (t) => ({ x: t.t, y: valueByT.get(t.t), trade: t });
  // Voluntary sells and rule-9 forced exits are both "not a buy" but are
  // distinct decisions (one chosen by the policy, one structurally
  // unconditional) — kept as separate marker datasets, not lumped into one
  // "Sell", matching the "Recent decisions" feed's own buy/sell/forced_exit
  // color convention (green/yellow/red).
  const buyPoints    = s.recent_trades.filter(t => t.kind === 'buy').map(toPoint).filter(p => p.y !== undefined);
  const sellPoints   = s.recent_trades.filter(t => t.kind === 'sell').map(toPoint).filter(p => p.y !== undefined);
  const forcedPoints = s.recent_trades.filter(t => t.kind === 'forced_exit').map(toPoint).filter(p => p.y !== undefined);

  if (!valueChart) {
    valueChart = new Chart(document.getElementById('value-chart'), {
      type: 'line',
      data: { datasets: [
        { label: 'Portfolio value', data: points, borderColor: '#4f8ef7', borderWidth: 3, pointRadius: 0, tension: .15 },
        { label: 'Stock value', data: stockPoints, borderColor: 'rgba(79,142,247,.65)', borderWidth: 1.75, pointRadius: 0, tension: .15 },
        { label: 'Cash (incl. reserved)', data: cashPoints, borderColor: 'rgba(79,142,247,.5)', borderDash: [6,3], borderWidth: 1.5, pointRadius: 0, tension: .15 },
        { label: 'Initial cash', data: baseline, borderColor: 'rgba(148,163,184,.4)', borderDash: [4,4], borderWidth: 1.5, pointRadius: 0 },
        { label: 'Buy', data: buyPoints, showLine: false, pointStyle: 'circle',
          pointRadius: 3, pointHoverRadius: 5, backgroundColor: '#3dd68c', borderColor: '#3dd68c',
          hidden: !loadShowTrades() },
        { label: 'Sell', data: sellPoints, showLine: false, pointStyle: 'crossRot',
          pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
          backgroundColor: '#f5c842', borderColor: '#f5c842',
          hidden: !loadShowTrades() },
        { label: 'Forced exit', data: forcedPoints, showLine: false, pointStyle: 'rectRot',
          pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
          backgroundColor: '#f76f6f', borderColor: '#f76f6f',
          hidden: !loadShowTrades() },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'hour', minUnit: 'hour', tooltipFormat: 'MMM d, HH:mm', displayFormats: { hour: 'HH:mm' } },
            title: { display: true, text: 'Date', color: '#6b7280' },
            grid: { color: '#1e2338' },
            ticks: {
              major: { enabled: true },
              font: (ctx) => ctx.tick && ctx.tick.major ? { weight: '600', size: 11 } : { size: 10 },
              color: (ctx) => ctx.tick && ctx.tick.major ? '#94a3b8' : '#6b7280',
            },
          },
          y: { title: { display: true, text: '₹', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 18, boxHeight: 2, color: '#94a3b8', font: { size: 11 } } },
          tooltip: { callbacks: { label: (item) => {
            if (item.raw && item.raw.trade) {
              const t = item.raw.trade;
              return `${t.kind === 'forced_exit' ? 'FORCED EXIT' : t.kind.toUpperCase()} ${t.symbol}: ${t.quantity.toFixed(0)} @ ${fmtRupee(t.price)}`;
            }
            return `${item.dataset.label}: ${fmtRupee(item.parsed.y)}`;
          } } },
        },
      },
    });
  } else {
    valueChart.data.datasets[0].data = points;
    valueChart.data.datasets[1].data = stockPoints;
    valueChart.data.datasets[2].data = cashPoints;
    valueChart.data.datasets[3].data = baseline;
    valueChart.data.datasets[4].data = buyPoints;
    valueChart.data.datasets[5].data = sellPoints;
    valueChart.data.datasets[6].data = forcedPoints;
    valueChart.update('none');
  }

  const trades = [...s.recent_trades].reverse();
  document.getElementById('trade-feed').innerHTML = trades.length ? trades.map(t => `
    <div class="trade-row">
      <span class="trade-kind trade-${t.kind}">${t.kind === 'forced_exit' ? 'forced' : t.kind}</span>
      <span class="trade-date">${fmtTradeStamp(t)}</span>
      <span class="trade-sym">${esc(t.symbol)}</span>
      <span class="trade-amt">${t.quantity.toFixed(0)} shares @ ${fmtRupee(t.price)}, for ${fmtRupee(t.notional)}</span>
    </div>`).join('') : `<div class="na" style="padding:14px">No trades yet this episode</div>`;
}

// 8-hue CVD-safe categorical order (dataviz skill's default palette, dark-
// surface steps), cycling once more validation runs accumulate than colors
// — every run gets a genuinely distinct hue instead of the old single-green
// gradient, which read as "every line is the same color" once there were
// more than a couple of runs on screen. The per-run toggle chips (see
// `renderValRunsChart`) are what make color collisions past the 8th run
// tolerable: the chip legend always names which iteration a hue belongs to,
// and a colliding pair can just be isolated by hiding everything else.
const VAL_RUN_PALETTE = [
  '#3987e5', // blue
  '#d9823f', // orange
  '#1fc08a', // aqua
  '#d9a62a', // yellow
  '#d55181', // magenta
  '#39c95c', // green
  '#9085e9', // violet
  '#e66767', // red
];

function valRunHue(rank) {
  return VAL_RUN_PALETTE[rank % VAL_RUN_PALETTE.length];
}

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha.toFixed(2)})`;
}

// Hue identifies the run; a small recency dip on top (older runs slightly
// more transparent than the most recent) keeps "which run is newest" legible
// at a glance without it being the only thing distinguishing two lines.
function valRunColor(rank, total) {
  const t = total <= 1 ? 1 : rank / (total - 1);
  const alpha = 0.55 + 0.45 * t;
  return hexToRgba(valRunHue(rank), alpha);
}

function renderValRunsChart(runs) {
  lastValRuns = runs;
  renderValDistChart(runs);
  renderValTrades();
  if (!runs.length) {
    document.getElementById('val-chart-sub').textContent = 'No held-out evaluation completed yet';
    document.getElementById('val-run-bulk-row').style.display = 'none';
    document.getElementById('val-run-toggles').innerHTML = '';
    document.getElementById('val-holdings-sub').textContent = '';
    document.getElementById('val-holdings-body').innerHTML = '';
    return;
  }
  document.getElementById('val-run-bulk-row').style.display = '';

  // Always the most recently completed run, regardless of which runs are
  // toggled on/off in the chart above — the chip toggles control chart
  // visibility only, not which run this table describes.
  const latestRun = runs[runs.length - 1];
  document.getElementById('val-holdings-sub').textContent =
    `Iter ${latestRun.iteration} · final value ${fmtRupee(latestRun.final_value)} · ` +
    `return ${latestRun.val_return >= 0 ? '+' : ''}${(latestRun.val_return * 100).toFixed(2)}%`;
  document.getElementById('val-holdings-body').innerHTML = latestRun.final_holdings
    ? holdingsRowsHtml(latestRun.final_holdings, 'effective_price')
    : `<tr><td colspan="6" class="na" style="padding:14px">Not recorded for this run (written before this table was added)</td></tr>`;
  document.getElementById('val-chart-sub').textContent =
    `${runs.length} run${runs.length === 1 ? '' : 's'} · each run its own color ` +
    `(cycles after ${VAL_RUN_PALETTE.length}) · faint = earliest iteration (${runs[0].iteration}), ` +
    `bold = most recent (${runs[runs.length - 1].iteration})`;

  // One chip per run — unchecking it hides that run's 3 lines (and its trade
  // markers, below) without affecting any other run. Stale hidden iterations
  // (a run that's aged out of val_runs.jsonl — doesn't happen today since
  // that file is append-only forever, but defensively) are dropped here so
  // the saved set never grows unboundedly.
  hiddenValRuns = new Set([...hiddenValRuns].filter(it => runs.some(r => r.iteration === it)));
  const runsRange = document.getElementById('val-runs-recent-range');
  const visibleN = runs.length - hiddenValRuns.size;
  runsRange.max = runs.length;
  runsRange.value = Math.max(1, visibleN);
  document.getElementById('val-runs-recent-label').textContent =
    visibleN === runs.length ? `all (${runs.length})` : `${visibleN} of ${runs.length}`;
  document.getElementById('val-run-toggles').innerHTML =
    runs.map((run, i) => {
      const off = hiddenValRuns.has(run.iteration);
      return `<label class="val-run-chip ${off ? 'chip-off' : ''}" data-iter="${run.iteration}">
        <input type="checkbox" ${off ? '' : 'checked'}>
        <span class="chip-dot" style="background:${valRunHue(i)}"></span>
        Iter ${run.iteration}
      </label>`;
    }).join('');

  // One line per run on the top (portfolio-value) chart, two on the bottom
  // (stock/cash split) chart — same color per run (valRunColor's cycling
  // palette) on both, so a run reads as the same visual identity across the
  // two linked charts even though its lines live in separate Chart.js
  // instances. A run unchecked in the toggle bar above is marked `hidden`
  // here rather than dropped from the array, so Chart.js's own dataset
  // bookkeeping stays consistent run to run.
  const portfolioDatasets = [];
  const splitDatasets = [];
  runs.forEach((run, i) => {
    const color  = valRunColor(i, runs.length);
    const isLast = i === runs.length - 1;
    const hidden = hiddenValRuns.has(run.iteration);
    portfolioDatasets.push({
      label: `Iter ${run.iteration} — portfolio value`,
      data: run.value_curve.map(p => ({ x: p.t, y: p.value })),
      borderColor: color, borderWidth: isLast ? 3 : 1.6, pointRadius: 0, tension: .15, hidden,
    });
    splitDatasets.push({
      label: `Iter ${run.iteration} — stock value`,
      data: run.value_curve.map(p => ({ x: p.t, y: p.stocks_value })),
      borderColor: color, borderWidth: isLast ? 1.9 : 1, pointRadius: 0, tension: .15, hidden,
    });
    splitDatasets.push({
      label: `Iter ${run.iteration} — cash (incl. reserved)`,
      data: run.value_curve.map(p => ({ x: p.t, y: p.cash_value })),
      borderColor: color, borderDash: [6, 3], borderWidth: isLast ? 1.6 : .9, pointRadius: 0, tension: .15, hidden,
    });
  });

  // Trade markers across every plotted (non-hidden) run at once, each
  // colored to match its own line (via per-point backgroundColor) so a
  // marker is traceable back to its run even without a per-run legend entry.
  // Voluntary sells and rule-9 forced exits are split into separate datasets
  // (not lumped as one "Sell") — same distinction and color convention
  // (yellow/red) as the current-episode chart and the "Recent decisions" feed.
  const showVal = loadShowValTrades();
  const buyPoints = [], sellPoints = [], forcedPoints = [];
  runs.forEach((run, i) => {
    if (hiddenValRuns.has(run.iteration)) return;
    const valueByT = new Map(run.value_curve.map(p => [p.t, p.value]));
    const color = valRunColor(i, runs.length);
    for (const t of run.trades) {
      const y = valueByT.get(t.t);
      if (y === undefined) continue;
      const pt = { x: t.t, y, trade: t, iteration: run.iteration, color };
      if (t.kind === 'buy') buyPoints.push(pt);
      else if (t.kind === 'sell') sellPoints.push(pt);
      else forcedPoints.push(pt);
    }
  });

  const buyDataset = {
    label: 'Buy', data: buyPoints, showLine: false, pointStyle: 'circle',
    pointRadius: 3, pointHoverRadius: 5,
    backgroundColor: (ctx) => ctx.raw?.color || '#3dd68c',
    borderColor: (ctx) => ctx.raw?.color || '#3dd68c',
    hidden: !showVal,
  };
  const sellDataset = {
    label: 'Sell', data: sellPoints, showLine: false, pointStyle: 'crossRot',
    pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
    backgroundColor: (ctx) => ctx.raw?.color || '#f5c842',
    borderColor: '#f5c842',
    hidden: !showVal,
  };
  const forcedDataset = {
    label: 'Forced exit', data: forcedPoints, showLine: false, pointStyle: 'rectRot',
    pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
    backgroundColor: (ctx) => ctx.raw?.color || '#f76f6f',
    borderColor: '#f76f6f',
    hidden: !showVal,
  };

  // Same linked-pair pattern as the current-episode section: the top chart
  // (portfolio value + trade markers) hides its own x-axis labels/title and
  // borrows the bottom chart's (stock/cash split), directly beneath it, so
  // the two read as one panel sharing a single time axis.
  if (!valRunsChart) {
    valRunsChart = new Chart(document.getElementById('val-chart'), {
      type: 'line',
      data: { datasets: [...portfolioDatasets, buyDataset, sellDataset, forcedDataset] },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'day', tooltipFormat: 'MMM d, HH:mm', displayFormats: { day: 'MMM d' } },
            title: { display: false },
            ticks: { display: false },
            grid: { color: '#1e2338' },
          },
          y: { title: { display: true, text: '₹', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          // No legend: dataset count grows unboundedly (one line per
          // validation run) — see valRunColor's comment for why a cycling
          // categorical palette plus the chip bar replaces a legend here.
          legend: { display: false },
          tooltip: { callbacks: { label: (item) => {
            if (item.raw && item.raw.trade) {
              const t = item.raw.trade;
              return `Iter ${item.raw.iteration} · ${t.kind === 'forced_exit' ? 'FORCED EXIT' : t.kind.toUpperCase()} ` +
                     `${t.symbol}: ${t.quantity.toFixed(0)} @ ${fmtRupee(t.price)}`;
            }
            return `${item.dataset.label}: ${fmtRupee(item.parsed.y)}`;
          } } },
        },
      },
    });
  } else {
    // Dataset count itself changes (a new line per run) — rebuild wholesale
    // rather than mutating in place like the fixed-dataset-count charts.
    valRunsChart.data.datasets = [...portfolioDatasets, buyDataset, sellDataset, forcedDataset];
    valRunsChart.update('none');
  }

  if (!valRunsSplitChart) {
    valRunsSplitChart = new Chart(document.getElementById('val-split-chart'), {
      type: 'line',
      data: { datasets: splitDatasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'day', tooltipFormat: 'MMM d, HH:mm', displayFormats: { day: 'MMM d' } },
            title: { display: true, text: 'Held-out window date', color: '#6b7280' },
            grid: { color: '#1e2338' },
          },
          y: { title: { display: true, text: '₹', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (item) => `${item.dataset.label}: ${fmtRupee(item.parsed.y)}` } },
        },
      },
    });
  } else {
    valRunsSplitChart.data.datasets = splitDatasets;
    valRunsSplitChart.update('none');
  }
}

// Dashed vertical line at the mean return (plus, once there are
// VAL_DIST_FIT_MIN_RUNS runs, a fitted normal curve), drawn over the histogram. The
// category x-axis has no numeric scale, so the mean's fractional position in
// bin units is converted to pixels by interpolating between bin centers.
const VAL_DIST_FIT_MIN_RUNS = 50;   // normal-fit curve only drawn once this many validation runs exist
const valDistMeanPlugin = {
  id: 'valDistMean',
  afterDatasetsDraw(chart, _args, opts) {
    if (!opts || opts.pos == null) return;
    const { ctx, chartArea, scales: { x } } = chart;
    const x0 = x.getPixelForValue(0), x1 = x.getPixelForValue(1);
    const px = x0 + (opts.pos - 0.5) * (x1 - x0);
    const f = opts.fit, y = chart.scales.y;
    if (f) {
      ctx.save();
      ctx.strokeStyle = '#8b9cff'; ctx.lineWidth = 2;
      ctx.beginPath();
      const nPts = 120, nBins = chart.data.labels.length;
      for (let i = 0; i <= nPts; i++) {
        const u = i / nPts * nBins;                       // position in bin units, 0..nBins
        const z = ((u + f.first) * f.step - f.mu) / f.sigma;
        const density = f.n * f.step * Math.exp(-0.5 * z * z) / (f.sigma * Math.sqrt(2 * Math.PI));
        const cx = x0 + (u - 0.5) * (x1 - x0), cy = y.getPixelForValue(density);
        i === 0 ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy);
      }
      ctx.stroke();
      ctx.restore();
    }
    if (px < chartArea.left || px > chartArea.right) return;
    ctx.save();
    ctx.strokeStyle = '#e5e7eb'; ctx.fillStyle = '#e5e7eb'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(px, chartArea.top); ctx.lineTo(px, chartArea.bottom); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '12px sans-serif';
    const right = px < (chartArea.left + chartArea.right) / 2;
    ctx.textAlign = right ? 'left' : 'right';
    ctx.fillText(opts.label, px + (right ? 6 : -6), chartArea.top + 12);
    ctx.restore();
  },
};

// Distribution of (final value - initial value) / initial value across every
// held-out validation run in val_runs.jsonl — one sample per run. Bin width is
// VAL_DIST_BIN_PCT, with bin edges anchored at 0 so a bar never straddles
// break-even.
function renderValDistChart(allRuns) {
  const sub = document.getElementById('val-dist-sub');
  if (!sub) return;
  const skipFirst = document.getElementById('val-dist-skip-toggle').checked;
  let runs = skipFirst ? allRuns.slice(VAL_DIST_SKIP_RUNS) : allRuns;
  const range = document.getElementById('val-dist-recent-range');
  const rangeMax = Math.max(VAL_DIST_MIN_RECENT, runs.length);
  range.max = rangeMax;
  const recentN = valDistRecentN && valDistRecentN < rangeMax ? valDistRecentN : 0;
  range.value = recentN || rangeMax;
  document.getElementById('val-dist-recent-label').textContent = recentN ? `last ${recentN}` : `all (${runs.length})`;
  if (recentN) runs = runs.slice(-recentN);
  if (!runs.length || !initialCash) {
    sub.textContent = runs.length ? 'Waiting for run config (initial cash)'
      : allRuns.length ? `No runs left after skipping the first ${VAL_DIST_SKIP_RUNS} (${allRuns.length} so far)`
      : 'No held-out evaluation completed yet';
    if (valDistChart) { valDistChart.data.labels = []; valDistChart.data.datasets[0].data = [];
                        valDistChart.options.plugins.valDistMean = {}; valDistChart.update('none'); }
    return;
  }
  const rets = runs.map(r => (r.final_value - initialCash) / initialCash * 100);
  const lo = Math.min(...rets), hi = Math.max(...rets);
  const step = VAL_DIST_BIN_PCT;
  const first = Math.floor(lo / step), last = Math.max(Math.floor(hi / step), first);
  const counts = new Array(last - first + 1).fill(0);
  rets.forEach(v => counts[Math.floor(v / step) - first]++);
  const fmt = (v) => (Math.abs(v) < 1e-9 ? 0 : v).toFixed(step < 1 ? 1 : 0);
  const labels = counts.map((_, i) => `${fmt((first + i) * step)}% – ${fmt((first + i + 1) * step)}%`);
  const colors = counts.map((_, i) => (first + i) >= 0 ? 'rgba(61,214,140,0.7)' : 'rgba(247,111,111,0.7)');

  const sorted = [...rets].sort((a, b) => a - b);
  const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
  const median = sorted.length % 2 ? sorted[(sorted.length - 1) / 2]
    : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
  const pos = rets.filter(v => v > 0).length;
  const sg = (v) => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
  const sigma = Math.sqrt(rets.reduce((a, v) => a + (v - mean) ** 2, 0) / (rets.length - 1));
  const fit = rets.length >= VAL_DIST_FIT_MIN_RUNS && sigma > 0
    ? { mu: mean, sigma, n: rets.length, step, first } : null;
  const meanLine = { pos: mean / step - first, label: `mean ${sg(mean)}`, fit };
  const yMax = Math.max(...counts, fit ? fit.n * step / (sigma * Math.sqrt(2 * Math.PI)) : 0) * 1.1;
  const fitNote = fit ? ` · normal fit σ ${sigma.toFixed(2)}% (curve)`
                      : ` · fitted curve appears at ${VAL_DIST_FIT_MIN_RUNS} runs`;
  sub.textContent = `${runs.length}${runs.length < allRuns.length ? ` of ${allRuns.length}` : ''} run${runs.length === 1 ? '' : 's'} · mean ${sg(mean)} (dashed line) · median ${sg(median)} · ` +
    `${pos}/${runs.length} profitable (${(pos / runs.length * 100).toFixed(0)}%) · range ${sg(lo)} … ${sg(hi)}${fitNote}`;

  if (!valDistChart) {
    valDistChart = new Chart(document.getElementById('val-dist-chart'), {
      type: 'bar',
      data: { labels, datasets: [{ data: counts, backgroundColor: colors, categoryPercentage: 1, barPercentage: 1 }] },
      plugins: [valDistMeanPlugin],
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: {
          x: { title: { display: true, text: 'Return (final − initial) / initial', color: '#6b7280' }, grid: { display: false } },
          y: { title: { display: true, text: 'Validation runs', color: '#6b7280' }, beginAtZero: true, suggestedMax: yMax,
               ticks: { precision: 0 }, grid: { color: '#2e3350' } },
        },
        plugins: { legend: { display: false }, valDistMean: meanLine,
                   tooltip: { callbacks: { label: (item) => `${item.raw} run${item.raw === 1 ? '' : 's'}` } } },
      },
    });
  } else {
    const ds = valDistChart.data.datasets[0];
    valDistChart.data.labels = labels;
    valDistChart.options.plugins.valDistMean = meanLine;
    valDistChart.options.scales.y.suggestedMax = yMax;
    ds.data = counts; ds.backgroundColor = colors;
    valDistChart.update('none');
  }
}

function paramItem(label, value) {
  return `<div class="param-item"><div class="l">${esc(label)}</div><div class="v">${value}</div></div>`;
}

// run_config.json is written once per run (fresh start or --resume) and
// barely changes mid-run — see save_run_config in scripts/train_trading_policy.jl.
// resolved_device/resolved_minibatch/resolved_train_*/resolved_val_*/
// n_candidates_*/n_max_holdings_*/rule_constants are all informational-only
// fields added purely for this card; everything else here is the
// RESUMABLE_KEYS subset the script itself reads back on --resume. Note
// train_start/train_end/val_start/val_end (no "resolved_" prefix) ARE
// RESUMABLE_KEYS entries — the RAW --train-start/etc. override if one was
// given, null otherwise — not what actually ran; always read the
// resolved_train_*/resolved_val_* fields for display.
// --val-days is only used when the validation window is derived from the end
// of the data (trailing mode with no explicit --val-start/--val-end, e.g. no
// date_window.json); otherwise the real span is whatever the resolved dates say.
function valDaysLabel(cfg) {
  const derived = cfg.val_window === 'trailing' && cfg.val_start == null && cfg.val_end == null;
  if (derived && cfg.val_days != null) return `${cfg.val_days}`;
  const a = Date.parse(cfg.resolved_val_start), b = Date.parse(cfg.resolved_val_end);
  if (isNaN(a) || isNaN(b)) return cfg.val_days != null ? `${cfg.val_days}` : '—';
  return `${Math.round((b - a) / 86400000)}`;
}

function renderRunConfig(cfg) {
  if (cfg.initial_cash && cfg.initial_cash !== initialCash) {
    initialCash = cfg.initial_cash;
    renderValDistChart(lastValRuns);
  }
  document.getElementById('run-config-card').style.display = '';
  document.getElementById('run-config-sub').textContent =
    `${cfg.n_candidates_train ?? '—'} train / ${cfg.n_candidates_val ?? '—'} val candidates · ` +
    `train ${cfg.resolved_train_start ?? '—'} → ${cfg.resolved_train_end ?? '—'} ` +
    `· val ${cfg.resolved_val_start ?? '—'} → ${cfg.resolved_val_end ?? '—'}`;

  const rc  = cfg.rule_constants || {};
  const pct = (v) => v == null ? '—' : (v * 100).toFixed(2) + '%';

  document.getElementById('run-config-body').innerHTML = `
    <div class="param-section-label">Run config</div>
    <div class="param-grid">
      ${paramItem('Game version', 'v' + (rc.game_version ?? cfg.game_version ?? 1))}
      ${paramItem('Device', cfg.resolved_device ?? cfg.device ?? '—')}
      ${paramItem('Minibatch', cfg.resolved_minibatch ?? cfg.minibatch ?? '—')}
      ${paramItem('Learning rate', cfg.lr ?? '—')}
      ${paramItem('Entropy coef', cfg.entropy_coef ?? '—')}
      ${paramItem('Eval every', cfg.eval_every != null ? cfg.eval_every + ' iters' : '—')}
      ${paramItem('Val days', valDaysLabel(cfg))}
      ${paramItem('Val window', cfg.val_window ?? '—')}
      ${paramItem('Initial cash', cfg.initial_cash != null ? fmtRupee(cfg.initial_cash) : '—')}
      ${paramItem('Seed', cfg.seed ?? 'none')}
      ${paramItem('Train candidates', cfg.n_candidates_train ?? '—')}
      ${paramItem('Val candidates', cfg.n_candidates_val ?? '—')}
    </div>

    <div class="param-section-label">Rule-derived constants</div>
    <div class="param-grid">
      ${paramItem('Fee rate', pct(rc.fee_rate))}
      ${paramItem('Settlement days', rc.settlement_days ?? '—')}
      ${paramItem('Min hold days', rc.min_hold_days ?? '—')}
      ${paramItem('Max hold days', rc.max_hold_days ?? '—')}
      ${paramItem('Max position frac.', pct(rc.max_position_fraction))}
      ${paramItem('Max holdings (train)', cfg.n_max_holdings_train != null ? `${cfg.n_max_holdings_train} (${pct(rc.n_max_holdings_fraction)} of universe)` : '—')}
      ${paramItem('Max holdings (val)', cfg.n_max_holdings_val != null ? `${cfg.n_max_holdings_val} (${pct(rc.n_max_holdings_fraction)} of universe)` : '—')}
      ${paramItem('Max cash frac.', pct(rc.max_cash_fraction))}
      ${paramItem('Cash ceiling penalty', rc.cash_ceiling_penalty_coef ?? '—')}
      ${paramItem('Illegal-action penalty', rc.game_version >= 2 ? (rc.illegal_penalty_coef ?? '—') : 'n/a')}
      ${paramItem('Hold penalty (v2+)', rc.game_version >= 2 ? (rc.hold_penalty_coef ?? '—') : 'n/a')}
      ${paramItem('Rebuy cooldown', rc.rebuy_cooldown_days != null ? rc.rebuy_cooldown_days + ' days' : '—')}
      ${paramItem('Gamma / GAE λ', (rc.gamma ?? '—') + ' / ' + (rc.gae_lambda ?? '—'))}
      ${paramItem('Clip epsilon', rc.clip_eps ?? '—')}
      ${paramItem('Value loss coef', rc.value_loss_coef ?? '—')}
    </div>
  `;
  renderHyperparamValues(cfg);
}

function renderHyperparamValues(cfg) {
  const rc = cfg.rule_constants || {};
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v ?? '—'; };
  set('hp-lr', cfg.lr);
  set('hp-minibatch', cfg.resolved_minibatch ?? cfg.minibatch);
  set('hp-clip', rc.clip_eps);
  set('hp-gamma', rc.gamma);
  set('hp-lambda', rc.gae_lambda);
  set('hp-vf', rc.value_loss_coef);
  set('hp-entropy', cfg.entropy_coef);
  set('hp-eval', cfg.eval_every != null ? cfg.eval_every + ' iters' : null);
  const gl = (rc.gamma ?? NaN) * (rc.gae_lambda ?? NaN);
  set('hp-gl-horizon', isFinite(gl) && gl < 1 ? (1 / (1 - gl)).toFixed(1) : null);
}

async function pollLive() {
  try {
    const s = await fetchJSON(LIVE_URL);
    revealLayout();
    renderStatus(s);
  } catch {
    // no live_status.json yet (or a training run isn't currently active) —
    // leave whatever's on screen (placeholder, or the last good frame).
  }
}

async function pollLog() {
  try {
    const rows = await fetchJSONL(LOG_URL);
    revealLayout();
    renderIterChart(rows);
  } catch { /* no episode_log.jsonl yet */ }
}

async function pollValRuns() {
  try {
    const runs = await fetchJSONL(VAL_RUNS_URL);
    revealLayout();
    renderValRunsChart(runs);
  } catch { /* no val_runs.jsonl yet */ }
}

async function pollRunConfig() {
  try {
    const cfg = await fetchJSON(RUN_CONFIG_URL);
    revealLayout();
    renderRunConfig(cfg);
  } catch { /* no run_config.json yet */ }
}

pollLive(); pollLog(); pollValRuns(); pollRunConfig();
setInterval(pollLive, 3000);
setInterval(pollLog, 8000);
// Held-out runs only land once every eval_every iterations (tens of minutes
// apart in practice), and the file only grows (every run ever completed is
// kept — see save_val_run!'s docstring), so there's no reason to poll it as
// often as the live, per-bar status.
setInterval(pollValRuns, 20000);
// run_config.json is written once per run start/resume and otherwise static
// — polled only so a --resume with changed flags (while this page stays
// open) picks up the new values without a manual refresh.
setInterval(pollRunConfig, 20000);
</script>
