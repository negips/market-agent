<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Training — market-agent</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  .section-title {
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .07em;
    margin: 34px 0 12px; display: flex; align-items: center; gap: 10px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .status-bar {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 20px; margin-bottom: 18px;
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 7px; }
  .status-live  { background: var(--green); animation: pulse 1.4s infinite; }
  .status-idle  { background: var(--muted); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(61,214,140,.5)} 70%{box-shadow:0 0 0 7px rgba(61,214,140,0)} 100%{box-shadow:0 0 0 0 rgba(61,214,140,0)} }
  .status-label { font-size: 13px; font-weight: 600; color: var(--text); }
  .status-sub { font-size: 11.5px; color: var(--muted); }
  .status-metric { text-align: right; }
  .status-metric .v { font-size: 16px; font-weight: 700; font-family: var(--mono); }
  .status-metric .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .phase-pill {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700;
    padding: 2px 9px; border-radius: 99px;
  }
  .phase-train  { background: rgba(79,142,247,.15); color: var(--accent); }
  .phase-val    { background: rgba(61,214,140,.15); color: var(--green); }
  .phase-update { background: rgba(245,200,66,.15); color: var(--yellow); }

  .update-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 20px; margin-bottom: 18px; display: flex; align-items: center; gap: 16px;
  }
  .update-bar .label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
  .update-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .update-fill { height: 100%; background: var(--yellow); border-radius: 99px; transition: width .3s ease; }
  .update-bar .pct { font-family: var(--mono); font-size: 12px; color: var(--yellow); width: 40px; text-align: right; }

  .placeholder {
    background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius);
    padding: 40px 24px; text-align: center; color: var(--text-dim); font-size: 13px;
  }
  .placeholder code { display: block; margin-top: 12px; color: var(--accent); font-family: var(--mono); font-size: 12.5px; }

  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px; margin-bottom: 18px;
  }
  .chart-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .chart-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .chart-sub { font-size: 11.5px; color: var(--muted); }
  .trade-toggle {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .trade-toggle input { accent-color: var(--accent); cursor: pointer; }
  .canvas-wrap { position: relative; height: 260px; margin-top: 14px; }
  .canvas-wrap.small { height: 180px; }

  .two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  .trade-feed { max-height: 320px; overflow-y: auto; }
  .trade-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 4px;
    border-bottom: 1px solid var(--border); font-size: 12px;
  }
  .trade-row:last-child { border-bottom: none; }
  .trade-kind {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 5px; flex-shrink: 0; width: 78px; text-align: center;
  }
  .trade-buy         { background: rgba(61,214,140,.12); color: var(--green); }
  .trade-sell        { background: rgba(245,200,66,.12); color: var(--yellow); }
  .trade-forced_exit { background: rgba(247,111,111,.12); color: var(--red); }
  .trade-date { color: var(--muted); font-size: 10.5px; width: 90px; flex-shrink: 0; font-family: var(--mono); }
  .trade-sym { font-weight: 600; flex: 1; }
  .trade-amt { font-family: var(--mono); color: var(--text-dim); font-size: 11.5px; }

  .pnl-pos { color: var(--green); }
  .pnl-neg { color: var(--red); }
</style>
</head>
<body>
<script src="assets/nav.js"></script>
<script src="assets/utils.js"></script>

<div class="main">
  <div class="page-header">
    <div class="page-title">Live Training</div>
    <div class="page-subtitle">Watch a PPO training run play out — portfolio value, current holdings, and every buy/sell as they happen</div>
  </div>

  <div class="page-content">
    <div id="content">
      <div class="placeholder" id="placeholder">
        Waiting for a training run…
        <code>julia --project=packages/TradingGame scripts/train_trading_policy.jl</code>
      </div>
    </div>
  </div>
</div>

<script>
Chart.defaults.color           = '#6b7280';
Chart.defaults.borderColor     = '#2e3350';
Chart.defaults.backgroundColor = 'transparent';

const LIVE_URL     = 'data/trading_game/live_status.json';
const LOG_URL      = 'data/trading_game/episode_log.jsonl';
const VAL_RUNS_URL = 'data/trading_game/val_runs.jsonl';

let shown = false;
let valueChart = null, iterChart = null, valRunsChart = null;

function loadShowTrades() {
  try { return localStorage.getItem('tgLiveShowTrades') !== 'off'; } catch { return true; }
}
function saveShowTrades(v) {
  try { localStorage.setItem('tgLiveShowTrades', v ? 'on' : 'off'); } catch {}
}
function loadShowValTrades() {
  try { return localStorage.getItem('tgValShowTrades') !== 'off'; } catch { return true; }
}
function saveShowValTrades(v) {
  try { localStorage.setItem('tgValShowTrades', v ? 'on' : 'off'); } catch {}
}

async function fetchJSON(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch failed: ' + url);
  return r.json();
}

async function fetchJSONL(url) {
  const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('fetch failed: ' + url);
  const text = await r.text();
  return text.trim().split('\n').filter(Boolean).map(l => JSON.parse(l));
}

function fmtRupee(v) {
  if (v == null) return '—';
  return '₹' + Math.round(v).toLocaleString('en-IN');
}

function fmtTradeStamp(t) {
  const [datePart, timePart] = (t.t && t.t.includes('T')) ? t.t.split('T') : [t.date, null];
  const [y, m, d] = datePart.split('-');
  const dmy = `${d}/${m}/${y.slice(2)}`;
  return timePart ? `${dmy}-${timePart.slice(0, 5)}` : dmy;
}

function revealLayout() {
  if (shown) return;
  shown = true;
  document.getElementById('content').innerHTML = `
    <div class="status-bar" id="status-bar"></div>
    <div class="update-bar" id="update-bar" style="display:none"></div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Current episode — portfolio value</div>
        <div style="display:flex; align-items:center; gap:14px">
          <div class="chart-sub" id="value-chart-sub"></div>
          <label class="trade-toggle">
            <input type="checkbox" id="show-trades-toggle" checked> Show trades
          </label>
        </div>
      </div>
      <div class="canvas-wrap"><canvas id="value-chart"></canvas></div>
    </div>

    <div class="two-col">
      <div class="chart-card" style="margin-bottom:0">
        <div class="chart-header">
          <div class="chart-title">Holdings</div>
          <div class="chart-sub" id="holdings-sub"></div>
        </div>
        <div class="tbl-wrap" style="margin-top:12px">
          <table class="data-table">
            <thead><tr>
              <th class="no-sort">Symbol</th><th class="no-sort">Qty</th>
              <th class="no-sort">Entry</th><th class="no-sort">Current</th>
              <th class="no-sort">Days held</th><th class="no-sort">Unrealized P&amp;L</th>
            </tr></thead>
            <tbody id="holdings-body"></tbody>
          </table>
        </div>
      </div>
      <div class="chart-card" style="margin-bottom:0">
        <div class="chart-header">
          <div class="chart-title">Recent decisions</div>
          <div class="chart-sub">Newest first</div>
        </div>
        <div class="trade-feed" id="trade-feed" style="margin-top:8px"></div>
      </div>
    </div>

    <div class="section-title">Training progress</div>
    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Episode return per iteration</div>
        <div class="chart-sub" id="iter-chart-sub">Σ log-return · training rollout vs held-out eval</div>
      </div>
      <div class="canvas-wrap"><canvas id="iter-chart"></canvas></div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-title">Held-out validation — portfolio value across runs</div>
        <div style="display:flex; align-items:center; gap:14px">
          <div class="chart-sub" id="val-chart-sub"></div>
          <label class="trade-toggle">
            <input type="checkbox" id="show-val-trades-toggle" checked> Show trades
          </label>
        </div>
      </div>
      <div class="canvas-wrap"><canvas id="val-chart"></canvas></div>
    </div>
  `;

  const toggle = document.getElementById('show-trades-toggle');
  toggle.checked = loadShowTrades();
  toggle.addEventListener('change', () => {
    saveShowTrades(toggle.checked);
    if (!valueChart) return;
    valueChart.setDatasetVisibility(2, toggle.checked);   // Buy
    valueChart.setDatasetVisibility(3, toggle.checked);   // Sell
    valueChart.update();
  });

  const valToggle = document.getElementById('show-val-trades-toggle');
  valToggle.checked = loadShowValTrades();
  valToggle.addEventListener('change', () => {
    saveShowValTrades(valToggle.checked);
    if (!valRunsChart) return;
    // Dataset count grows with every new validation run, so Buy/Sell aren't
    // at a fixed index like the current-episode chart — find them by label.
    valRunsChart.data.datasets.forEach((ds, i) => {
      if (ds.label === 'Buy' || ds.label === 'Sell') valRunsChart.setDatasetVisibility(i, valToggle.checked);
    });
    valRunsChart.update();
  });
}

const PHASE_LABEL = { train: 'Training', val: 'Held-out eval', update: 'Updating policy' };
const PHASE_CLASS  = { train: 'phase-train', val: 'phase-val', update: 'phase-update' };

function renderStatus(s) {
  const bar = document.getElementById('status-bar');
  const age = (Date.now() - Date.parse(s.updated_at + 'Z')) / 1000;
  const live = age < 15;
  const pnlPct = s.initial_cash > 0 ? (s.portfolio_value / s.initial_cash - 1) * 100 : 0;
  const pnlCls = pnlPct >= 0 ? 'pnl-pos' : 'pnl-neg';
  bar.innerHTML = `
    <div><span class="status-dot ${live ? 'status-live' : 'status-idle'}"></span>
      <span class="status-label">${live ? 'Live' : 'Idle'}</span>
      <div class="status-sub">updated ${age < 60 ? Math.round(age) + 's ago' : Math.round(age/60) + 'm ago'}</div>
    </div>
    <span class="phase-pill ${PHASE_CLASS[s.phase] || 'phase-train'}">${PHASE_LABEL[s.phase] || s.phase}</span>
    <div class="status-metric"><div class="v">${s.iteration}</div><div class="l">Iteration</div></div>
    <div class="status-metric"><div class="v">${s.current_date}</div><div class="l">Sim. date</div></div>
    <div class="status-metric"><div class="v">${s.n_candidates ?? '—'}</div><div class="l">Universe</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.portfolio_value)}</div><div class="l">Portfolio value</div></div>
    <div class="status-metric"><div class="v ${pnlCls}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</div><div class="l">vs. initial cash</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.cash)}</div><div class="l">Spendable cash</div></div>
    <div class="status-metric"><div class="v">${fmtRupee(s.reserved_cash)}</div><div class="l">Reserved (settling)</div></div>
  `;

  const updateBar = document.getElementById('update-bar');
  if (s.phase === 'update' && s.update_progress) {
    const p = s.update_progress;
    const pct = p.total_minibatches > 0 ? Math.round(100 * p.minibatch / p.total_minibatches) : 0;
    updateBar.style.display = 'flex';
    updateBar.innerHTML = `
      <div class="label">PPO update · epoch ${p.epoch}/${p.k_epochs} · minibatch ${p.minibatch}/${p.total_minibatches} · loss ${p.loss.toFixed(4)}</div>
      <div class="update-track"><div class="update-fill" style="width:${pct}%"></div></div>
      <div class="pct">${pct}%</div>
    `;
  } else {
    updateBar.style.display = 'none';
  }

  document.getElementById('value-chart-sub').textContent =
    `${s.holdings.length} position${s.holdings.length === 1 ? '' : 's'} held · episode started ${s.episode_started_at}Z`;

  const points   = s.value_curve.map(p => ({ x: p.t, y: p.value }));
  const baseline = s.value_curve.map(p => ({ x: p.t, y: s.initial_cash }));

  // Trades happen on a decision bar, which always has a matching value_curve
  // point at the same timestamp (the trade executes, THEN that bar's
  // portfolio value is marked and recorded) — so every trade maps onto the
  // line exactly, no interpolation needed. A trade whose bar has already
  // aged out of value_curve (shouldn't happen at LIVE_VALUE_CURVE_CAP's size,
  // but defensively) is just dropped rather than plotted at a wrong height.
  const valueByT = new Map(s.value_curve.map(p => [p.t, p.value]));
  const toPoint  = (t) => ({ x: t.t, y: valueByT.get(t.t), trade: t });
  const buyPoints  = s.recent_trades.filter(t => t.kind === 'buy').map(toPoint).filter(p => p.y !== undefined);
  const sellPoints = s.recent_trades.filter(t => t.kind !== 'buy').map(toPoint).filter(p => p.y !== undefined);

  if (!valueChart) {
    valueChart = new Chart(document.getElementById('value-chart'), {
      type: 'line',
      data: { datasets: [
        { label: 'Portfolio value', data: points, borderColor: '#4f8ef7', borderWidth: 2, pointRadius: 0, tension: .15 },
        { label: 'Initial cash', data: baseline, borderColor: 'rgba(148,163,184,.4)', borderDash: [4,4], borderWidth: 1.5, pointRadius: 0 },
        { label: 'Buy', data: buyPoints, showLine: false, pointStyle: 'circle',
          pointRadius: 3, pointHoverRadius: 5, backgroundColor: '#3dd68c', borderColor: '#3dd68c',
          hidden: !loadShowTrades() },
        { label: 'Sell', data: sellPoints, showLine: false, pointStyle: 'crossRot',
          pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
          backgroundColor: '#f76f6f', borderColor: '#f76f6f',
          hidden: !loadShowTrades() },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'hour', minUnit: 'hour', tooltipFormat: 'MMM d, HH:mm', displayFormats: { hour: 'HH:mm' } },
            title: { display: true, text: 'Date', color: '#6b7280' },
            grid: { color: '#1e2338' },
            ticks: {
              major: { enabled: true },
              font: (ctx) => ctx.tick && ctx.tick.major ? { weight: '600', size: 11 } : { size: 10 },
              color: (ctx) => ctx.tick && ctx.tick.major ? '#94a3b8' : '#6b7280',
            },
          },
          y: { title: { display: true, text: '₹', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 18, boxHeight: 2, color: '#94a3b8', font: { size: 11 } } },
          tooltip: { callbacks: { label: (item) => {
            if (item.raw && item.raw.trade) {
              const t = item.raw.trade;
              return `${t.kind === 'forced_exit' ? 'FORCED EXIT' : t.kind.toUpperCase()} ${t.symbol}: ${t.quantity.toFixed(0)} @ ${fmtRupee(t.price)}`;
            }
            return `${item.dataset.label}: ${fmtRupee(item.parsed.y)}`;
          } } },
        },
      },
    });
  } else {
    valueChart.data.datasets[0].data = points;
    valueChart.data.datasets[1].data = baseline;
    valueChart.data.datasets[2].data = buyPoints;
    valueChart.data.datasets[3].data = sellPoints;
    valueChart.update('none');
  }

  document.getElementById('holdings-sub').textContent = `Marked at ${s.current_date}`;
  document.getElementById('holdings-body').innerHTML = s.holdings.length ? s.holdings.map(h => `
    <tr>
      <td><span class="symbol-chip">${esc(h.symbol)}</span></td>
      <td class="num">${h.quantity.toFixed(2)}</td>
      <td class="num">${fmtRupee(h.entry_price)}</td>
      <td class="num">${fmtRupee(h.current_price)}</td>
      <td class="num">${h.days_held}</td>
      <td class="num ${h.unrealized_pnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${fmtRupee(h.unrealized_pnl)} (${h.unrealized_pnl_pct >= 0 ? '+' : ''}${h.unrealized_pnl_pct.toFixed(2)}%)</td>
    </tr>`).join('') : `<tr><td colspan="6" class="na" style="padding:14px">All cash — no open positions</td></tr>`;

  const trades = [...s.recent_trades].reverse();
  document.getElementById('trade-feed').innerHTML = trades.length ? trades.map(t => `
    <div class="trade-row">
      <span class="trade-kind trade-${t.kind}">${t.kind === 'forced_exit' ? 'forced' : t.kind}</span>
      <span class="trade-date">${fmtTradeStamp(t)}</span>
      <span class="trade-sym">${esc(t.symbol)}</span>
      <span class="trade-amt">${t.quantity.toFixed(0)} shares @ ${fmtRupee(t.price)}, for ${fmtRupee(t.notional)}</span>
    </div>`).join('') : `<div class="na" style="padding:14px">No trades yet this episode</div>`;
}

function renderIterChart(rows) {
  const labels = rows.map(r => r.iteration);
  const train  = rows.map(r => r.train_return);
  const val    = rows.map(r => r.val_return);
  const bests = rows.map(r => r.best_return).filter(v => v != null);
  document.getElementById('iter-chart-sub').textContent =
    `${rows.length} iteration${rows.length === 1 ? '' : 's'} logged · best return ${bests.length ? Math.max(...bests).toFixed(4) : '—'}`;
  if (!iterChart) {
    iterChart = new Chart(document.getElementById('iter-chart'), {
      type: 'line',
      data: { labels, datasets: [
        { label: 'Train return', data: train, borderColor: 'rgba(79,142,247,.5)', borderWidth: 1.5, pointRadius: 0, tension: 0 },
        { label: 'Held-out (val) return', data: val, borderColor: '#3dd68c', borderWidth: 2, pointRadius: 2, spanGaps: true },
      ]},
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { title: { display: true, text: 'Iteration', color: '#6b7280' }, grid: { color: '#1e2338' } },
          y: { title: { display: true, text: 'Σ log-return', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          legend: { display: true, position: 'top', align: 'end', labels: { boxWidth: 18, boxHeight: 2, color: '#94a3b8', font: { size: 11 } } },
        },
      },
    });
  } else {
    iterChart.data.labels = labels;
    iterChart.data.datasets[0].data = train;
    iterChart.data.datasets[1].data = val;
    iterChart.update('none');
  }
}

// A single hue (the same green used for the "val" phase pill), with opacity
// ramped by recency: the most recent held-out run is bold/opaque, older runs
// fade out. This is a deliberate choice over a generated categorical palette
// — the number of runs is open-ended (one more every `eval_every`
// iterations across a training run that can last days), so there's no fixed
// series count to assign fixed hues to, and a legend with dozens of entries
// would be unreadable. The gradient itself reads as "training progress"
// directly: a visually tightening/rising bundle of lines as iterations
// improve, a chaotic unchanging smear if they don't.
function valRunColor(rank, total) {
  const t = total <= 1 ? 1 : rank / (total - 1);
  const alpha = 0.15 + 0.75 * t;
  return `rgba(61,214,140,${alpha.toFixed(2)})`;
}

function renderValRunsChart(runs) {
  if (!runs.length) {
    document.getElementById('val-chart-sub').textContent = 'No held-out evaluation completed yet';
    return;
  }
  document.getElementById('val-chart-sub').textContent =
    `${runs.length} run${runs.length === 1 ? '' : 's'} · faint = earliest iteration (${runs[0].iteration}), ` +
    `bold = most recent (${runs[runs.length - 1].iteration})`;

  const lineDatasets = runs.map((run, i) => ({
    label: `Iter ${run.iteration}`,
    data: run.value_curve.map(p => ({ x: p.t, y: p.value })),
    borderColor: valRunColor(i, runs.length),
    borderWidth: i === runs.length - 1 ? 2.5 : 1.2,
    pointRadius: 0,
    tension: .15,
  }));

  // Trade markers across every plotted run at once, each colored to match
  // its own line (via per-point backgroundColor) so a marker is traceable
  // back to its run even without a per-run legend entry.
  const showVal = loadShowValTrades();
  const buyPoints = [], sellPoints = [];
  runs.forEach((run, i) => {
    const valueByT = new Map(run.value_curve.map(p => [p.t, p.value]));
    const color = valRunColor(i, runs.length);
    for (const t of run.trades) {
      const y = valueByT.get(t.t);
      if (y === undefined) continue;
      const pt = { x: t.t, y, trade: t, iteration: run.iteration, color };
      (t.kind === 'buy' ? buyPoints : sellPoints).push(pt);
    }
  });

  const buyDataset = {
    label: 'Buy', data: buyPoints, showLine: false, pointStyle: 'circle',
    pointRadius: 3, pointHoverRadius: 5,
    backgroundColor: (ctx) => ctx.raw?.color || '#3dd68c',
    borderColor: (ctx) => ctx.raw?.color || '#3dd68c',
    hidden: !showVal,
  };
  const sellDataset = {
    label: 'Sell', data: sellPoints, showLine: false, pointStyle: 'crossRot',
    pointRadius: 4, pointHoverRadius: 6, pointBorderWidth: 2,
    backgroundColor: (ctx) => ctx.raw?.color || '#f76f6f',
    borderColor: '#f76f6f',
    hidden: !showVal,
  };

  if (!valRunsChart) {
    valRunsChart = new Chart(document.getElementById('val-chart'), {
      type: 'line',
      data: { datasets: [...lineDatasets, buyDataset, sellDataset] },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        scales: {
          x: {
            type: 'time',
            time: { unit: 'day', tooltipFormat: 'MMM d, HH:mm', displayFormats: { day: 'MMM d' } },
            title: { display: true, text: 'Held-out window date', color: '#6b7280' },
            grid: { color: '#1e2338' },
          },
          y: { title: { display: true, text: '₹', color: '#6b7280' }, grid: { color: '#2e3350' } },
        },
        plugins: {
          // No legend: dataset count grows unboundedly (one line per
          // validation run) — see valRunColor's comment for why a
          // recency-gradient replaces per-series color identity here.
          legend: { display: false },
          tooltip: { callbacks: { label: (item) => {
            if (item.raw && item.raw.trade) {
              const t = item.raw.trade;
              return `Iter ${item.raw.iteration} · ${t.kind === 'forced_exit' ? 'FORCED EXIT' : t.kind.toUpperCase()} ` +
                     `${t.symbol}: ${t.quantity.toFixed(0)} @ ${fmtRupee(t.price)}`;
            }
            return `${item.dataset.label}: ${fmtRupee(item.parsed.y)}`;
          } } },
        },
      },
    });
  } else {
    // Dataset count itself changes (a new line per run) — rebuild wholesale
    // rather than mutating in place like the fixed-dataset-count charts.
    valRunsChart.data.datasets = [...lineDatasets, buyDataset, sellDataset];
    valRunsChart.update('none');
  }
}

async function pollLive() {
  try {
    const s = await fetchJSON(LIVE_URL);
    revealLayout();
    renderStatus(s);
  } catch {
    // no live_status.json yet (or a training run isn't currently active) —
    // leave whatever's on screen (placeholder, or the last good frame).
  }
}

async function pollLog() {
  try {
    const rows = await fetchJSONL(LOG_URL);
    revealLayout();
    renderIterChart(rows);
  } catch { /* no episode_log.jsonl yet */ }
}

async function pollValRuns() {
  try {
    const runs = await fetchJSONL(VAL_RUNS_URL);
    revealLayout();
    renderValRunsChart(runs);
  } catch { /* no val_runs.jsonl yet */ }
}

pollLive(); pollLog(); pollValRuns();
setInterval(pollLive, 3000);
setInterval(pollLog, 8000);
// Held-out runs only land once every eval_every iterations (tens of minutes
// apart in practice), and the file only grows (every run ever completed is
// kept — see save_val_run!'s docstring), so there's no reason to poll it as
// often as the live, per-bar status.
setInterval(pollValRuns, 20000);
</script>
</body>
</html>
